<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级工理论题库 · 在线答题</title>
<style>
  :root {
    --primary: #2b5cff;
    --primary-dark: #1d44c4;
    --bg: #f2f5fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16a34a;
    --green-bg: #ecfdf3;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --amber: #d97706;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #eef3ff 0%, var(--bg) 40%, #eef6ff 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 18px 60px; }

  /* 顶部进度条 */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 18px; color: var(--primary); letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px rgba(43,92,255,.15); }
  .score-pill { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
  .score-pill .ok { color: var(--green); }
  .score-pill .bad { color: var(--red); }
  .score-pill .rate { color: var(--primary); }

  /* 进度条 */
  .progress-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #6d8dff); border-radius: 999px; width: 0%; transition: width .3s ease; }

  /* 卡片 */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 26px; }

  /* 开始页 */
  .hero { text-align: center; padding: 14px 4px 8px; }
  .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: .5px; margin-bottom: 10px; }
  .hero h1 em { color: var(--primary); font-style: normal; }
  .hero .sub { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 22px 0 26px; }
  .stat { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 18px 10px; }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--primary); }
  .stat .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .settings { text-align: left; background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 22px; }
  .settings .stitle { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; flex-wrap: wrap; }
  .setting-row + .setting-row { border-top: 1px dashed var(--border); }
  .setting-row .slbl { font-size: 14px; color: var(--text); }
  .seg { display: inline-flex; background: #e8edf7; border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--muted); font-weight: 600; transition: all .15s; }
  .seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  /* 开关 */
  .switch { position: relative; width: 46px; height: 26px; background: #cbd5e1; border-radius: 999px; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--green); }
  .switch.on::after { left: 23px; }

  .btn { border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .08s, box-shadow .2s, background .2s; font-family: inherit; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(43,92,255,.3); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #c3cdf0; box-shadow: none; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-green { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(22,163,74,.25); }
  .btn-green:hover { background: #15803d; }
  .btn-wide { width: 100%; }
  .btn-sm { padding: 10px 16px; font-size: 14px; }

  /* 题目页 */
  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: .5px; }
  .tag-choice { background: #eef3ff; color: var(--primary); }
  .tag-judge { background: #fef3e2; color: var(--amber); }
  .q-count { color: var(--muted); font-size: 14px; font-weight: 600; }
  .q-text { font-size: 20px; line-height: 1.7; font-weight: 600; margin: 8px 0 22px; }
  .q-text .blank { color: var(--primary); }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt { display: flex; align-items: flex-start; gap: 14px; padding: 15px 18px; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; transition: all .15s; background: #fff; font-size: 16px; line-height: 1.6; }
  .opt:hover:not(.locked) { border-color: var(--primary); background: #f5f8ff; }
  .opt .key { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; background: #eef1f6; color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; transition: all .15s; }
  .opt .txt { flex: 1; }
  .opt.locked { cursor: default; }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .key { background: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); }
  .opt.wrong .key { background: var(--red); color: #fff; }
  .opt .mark { font-size: 18px; font-weight: 800; flex-shrink: 0; }
  .opt.correct .mark { color: var(--green); }
  .opt.wrong .mark { color: var(--red); }

  .feedback { display: none; margin-top: 20px; padding: 14px 18px; border-radius: 12px; font-size: 15px; font-weight: 600; line-height: 1.6; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--green-bg); color: #166534; border: 1px solid #bbf7d0; }
  .feedback.bad { background: var(--red-bg); color: #991b1b; border: 1px solid #fecaca; }
  .feedback .fb-title { font-size: 16px; font-weight: 800; }

  .nav-row { display: flex; gap: 12px; margin-top: 24px; }
  .nav-row .spacer { flex: 1; }

  /* 弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(3px); }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.25); max-width: 520px; width: 100%; padding: 28px; animation: pop .2s ease; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .m-icon { font-size: 44px; text-align: center; margin-bottom: 10px; }
  .modal h2 { text-align: center; font-size: 21px; margin-bottom: 14px; }
  .modal .ans-box { background: var(--green-bg); border: 1px solid #bbf7d0; border-radius: 12px; padding: 16px; text-align: center; margin: 16px 0 20px; }
  .modal .ans-box .ak { font-size: 13px; color: #166534; font-weight: 700; }
  .modal .ans-box .av { font-size: 19px; font-weight: 800; color: #14532d; margin-top: 6px; line-height: 1.5; }
  .modal .note { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  /* 结果页 */
  .result { text-align: center; padding: 20px 6px; }
  .result .r-icon { font-size: 60px; margin-bottom: 8px; }
  .result h2 { font-size: 26px; margin-bottom: 6px; }
  .result .r-sub { color: var(--muted); margin-bottom: 24px; }
  .big-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin: 10px 0 26px; }
  .big-stat { border-radius: 14px; padding: 20px 10px; border: 1px solid var(--border); }
  .big-stat .n { font-size: 30px; font-weight: 800; }
  .big-stat .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .bs-ok { background: var(--green-bg); } .bs-ok .n { color: var(--green); }
  .bs-bad { background: var(--red-bg); } .bs-bad .n { color: var(--red); }
  .bs-rate { background: #eef3ff; } .bs-rate .n { color: var(--primary); }

  .wrong-list { text-align: left; margin: 22px 0; max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
  .wrong-list .wl-item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.6; }
  .wrong-list .wl-item:last-child { border-bottom: 0; }
  .wrong-list .wl-q { color: var(--text); }
  .wrong-list .wl-a { color: var(--red); font-weight: 700; margin-top: 4px; }
  .wrong-list .wl-a .c { color: var(--green); }

  .hidden { display: none !important; }
  .mt { margin-top: 14px; }
  .hint { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 16px; }

  @media (max-width: 560px) {
    .card { padding: 20px 16px; }
    .q-text { font-size: 17px; }
    .opt { font-size: 15px; padding: 13px 14px; }
    .hero h1 { font-size: 23px; }
    .nav-row { flex-wrap: wrap; }
    .nav-row .spacer { display: none; }
    .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部 -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="brand"><span class="dot"></span>高级工理论题库</div>
    <div class="score-pill">
      <span class="ok">对 <b id="s-ok">0</b></span>
      <span class="bad">错 <b id="s-bad">0</b></span>
      <span class="rate">正确率 <b id="s-rate">0%</b></span>
    </div>
  </div>

  <div class="progress-track" id="progTrack" style="display:none">
    <div class="progress-fill" id="progFill"></div>
  </div>

  <!-- 开始页 -->
  <div class="card" id="page-start">
    <div class="hero">
      <h1>高级工理论 <em>在线答题</em></h1>
      <div class="sub">一题一题作答 · 选错自动弹出正确答案 · 自动计分与错题回顾</div>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="st-total">0</div><div class="lbl">题目总数</div></div>
        <div class="stat"><div class="num" id="st-choice">0</div><div class="lbl">选择题</div></div>
        <div class="stat"><div class="num" id="st-judge">0</div><div class="lbl">判断题</div></div>
      </div>

      <div class="settings">
        <div class="stitle">⚙️ 答题设置</div>
        <div class="setting-row">
          <span class="slbl">题型范围</span>
          <div class="seg" id="seg-type">
            <button data-v="all" class="on">全部</button>
            <button data-v="choice">选择题</button>
            <button data-v="judge">判断题</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="slbl">打乱题目顺序</span>
          <div class="switch" id="sw-shuffle" role="button" aria-label="打乱顺序"></div>
        </div>
        <div class="setting-row">
          <span class="slbl">答对后自动进入下一题</span>
          <div class="switch on" id="sw-auto" role="button" aria-label="自动下一题"></div>
        </div>
      </div>

      <button class="btn btn-primary btn-wide" id="btn-start">开始答题</button>
      <div class="hint">共 <b id="st-real">0</b> 道题已内置，无需联网，直接双击即可使用</div>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="card hidden" id="page-quiz">
    <div class="q-meta">
      <span class="tag" id="q-tag">选择题</span>
      <span class="q-count" id="q-count">第 1 / 100 题</span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div class="feedback" id="q-feedback"></div>
    <div class="nav-row">
      <button class="btn btn-ghost btn-sm" id="btn-prev">上一题</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btn-end">结束答题</button>
      <button class="btn btn-primary btn-sm" id="btn-next" style="display:none">下一题</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="card hidden" id="page-result">
    <div class="result">
      <div class="r-icon" id="r-icon">🏆</div>
      <h2 id="r-title">答题完成</h2>
      <div class="r-sub" id="r-sub">共作答 0 题</div>
      <div class="big-stats">
        <div class="big-stat bs-ok"><div class="n" id="r-ok">0</div><div class="l">答对</div></div>
        <div class="big-stat bs-bad"><div class="n" id="r-bad">0</div><div class="l">答错</div></div>
        <div class="big-stat bs-rate"><div class="n" id="r-rate">0%</div><div class="l">正确率</div></div>
      </div>
      <div id="r-wrong-wrap" class="hidden">
        <div class="wrong-list" id="r-wrong"></div>
      </div>
      <div class="nav-row">
        <button class="btn btn-green" id="btn-redo" style="flex:1">重做错题</button>
        <button class="btn btn-primary" id="btn-restart" style="flex:1">重新开始</button>
      </div>
    </div>
  </div>

  <!-- 弹窗 -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="m-icon" id="m-icon">❌</div>
      <h2 id="m-title">回答错误</h2>
      <div class="ans-box">
        <div class="ak">正确答案</div>
        <div class="av" id="m-ans"></div>
      </div>
      <div class="note" id="m-note"></div>
      <button class="btn btn-primary btn-wide" id="btn-modal-close">知道了，继续</button>
    </div>
  </div>

</div>

"n":6,"q":"钩体可分为钩头、钩身和钩尾3部分。","ans":"√"},{"n":7,"q":"缓冲器是用来缓和与衰减车辆在起动、制动及连挂车钩时由于牵引力的变化或相互碰撞而引起的纵向冲击和振动，从而可减轻对车辆结构的破坏作用，提高车辆运行时的平稳性。","ans":"√"},{"n":8,"q":"车钩工作时，各零部件处于不同的位置，起着不同的作用，从而使车钩具有闭锁、开锁和半开3种工作状态，称为车钩的三态作用。","ans":"×"},{"n":9,"q":"在闭锁位置时向上托起钩锁铁，其活动量为3-12mm。","ans":"√"},{"n":10,"q":"在平直线路连挂车辆时，使其中一个车钩呈全开状态，在小半径曲线上进行连挂车辆时，如果两车钩的纵向中心线偏离较大，连挂较为困难,可将两车钩均置于全开位置。","ans":"√"},{"n":11,"q":"能够传递制动机所产生的原力，并将该力扩大后推动闸瓦的部分，称为基础制动装置。","ans":"√"},{"n":12,"q":"初次减压量不得小于50kPa，追加减压时，每次应达到20kPa，累计减压量不大于140kPa。","ans":"√"},{"n":13,"q":"施行紧急制动后，应及时将大闸手柄移到缓解位。","ans":"×"},{"n":14,"q":"列车管压力为500kPa（与均衡风缸压力差不大于10kPa）。","ans":"√"},{"n":15,"q":"总风缸压力在600～700kPa范围内。","ans":"√"},{"n":16,"q":"常用制动性能，将大闸手柄从缓解位移至制动位，均衡风缸压力由500kPa降至360kPa的时间为5～8s，制动缸由0升至高压力的时间为6～9s。","ans":"√"},{"n":17,"q":"使用小闸时，制动缸最高压力为420kPa。","ans":"×"},{"n":18,"q":"当转换柱塞拨杆置于“空气位”时，空气制动阀作为单独制动阀（小闸）使用，直接控制作用管的压力变化，单独操纵本车的制动与缓解。","ans":"×"},{"n":19,"q":"在直接制动时，分配阀根据制动主管的压力变化来控制制动缸的压力变化。","ans":"×"},{"n":20,"q":"当转换柱塞拨杆置于“电空位”时，空气制动阀作为自动制动阀（大闸）使用，并通过控制均衡风缸的压力变化来操纵全列车的制动与缓解。","ans":"×"},{"n":21,"q":"JZ-7制动系统常采用109型分配阀。","ans":"×"},{"n":22,"q":"同时更换4块以上的新闸瓦时，应按制动缸活塞行程的上限进行调整。","ans":"×"},{"n":23,"q":"铁闸瓦按照含磷量的多少，可以分为普通铸铁闸瓦、中磷铸铁闸瓦和高磷铸铁闸瓦3种。","ans":"√"},{"n":24,"q":"打开紧急制动阀（按钮），应产生紧急制动作用，80Km/h运行时单机紧急制动距离为≤400m。","ans":"√"},{"n":25,"q":"如没有遇到紧急情况,押运人员千万不能拉动紧急制动阀手把,以免影响牵引机车司机的正常操作。","ans":"√"},{"n":26,"q":"紧急制动后，必须经5s以上，才能发生缓解作用。","ans":"×"},{"n":27,"q":"YZ-1型空气制动机制动主管的压力变化是通过均衡风缸的压力变化来控制的，而均衡风缸的压力变化是通过操纵自动制动阀来实现的。","ans":"√"},{"n":28,"q":"YZ-1型空气制动机的综合作用，分为自动制动作用、单独制动作用、自动制动后的单独缓解、紧急制动作用等状况。","ans":"√"},{"n":29,"q":"附挂回送时,调整安全阀的工作压力至180～220kPa。","ans":"√"},{"n":30,"q":"空气制动阀设有“空气位”和“电空位”两个位置。","ans":"√"},{"n":31,"q":"制动时，制动缸活塞杆伸出的长度称为制动缸活塞行程。","ans":"√"},{"n":32,"q":"大型养路机械活塞行程的调整都是通过调节基础制动装置的上、下拉杆的调整螺母来实现的。","ans":"√"},{"n":33,"q":"闸瓦的缓解间隙越大，制动缸活塞行程就越长。","ans":"√"},{"n":34,"q":"铁闸瓦剩余厚度应不小于为17mm。","ans":"√"},{"n":35,"q":"大型养路机械使用的闸瓦按材质可分为铸铁闸瓦和合成闸瓦两大类。","ans":"√"},{"n":36,"q":"JZ-7型空气制动机采用橡胶膜板、柱塞阀、O形密封圈、止阀等零部件。","ans":"√"},{"n":37,"q":"制动机小初次减压量不得少于50kPa。","ans":"√"},{"n":38,"q":"紧急制动后的单独缓解与自动制动后的单独缓解类似，只需下压大闸手柄就能实现本车的单独缓解。","ans":"√"},{"n":39,"q":"根据基础制动装置按闸瓦的分布状态，主要分为单闸瓦式和双闸瓦式两种。","ans":"√"},{"n":40,"q":"基础制动装置是利用杠杆原理，将制动缸产生的推力或手制动机产生的拉力，扩大适当倍数后，传给各闸瓦，使闸瓦抱紧车轮，产生制动作用，达到制动、停车的目的。","ans":"√"},{"n":41,"q":"在电气化铁路起道作业，两股钢轨同时起道时，一次作业起道量不得超过30mm，且两股钢轨起道量相差不得超过11mm，调整曲线超高时，单股起道量不得超过11mm。","ans":"√"},{"n":42,"q":"捣固车在有砟桥桥面作业时，必须先拆除影响捣固作业的护轨，测定轨枕底下道砟厚度，如厚度不足150mm时，严禁捣固作业。","ans":"√"},{"n":43,"q":"在技术状态不良的桥梁上或线路几何状态严重不良地段，不得进行动力稳定作业。","ans":"√"},{"n":44,"q":"长轨列车收轨速度不宜超过5km/h，卸轨速度不得超过15km/h。","ans":"√"},{"n":45,"q":"所有上道作业人员必须按规定穿戴具有反光功能的防护服,夜间作业应具备足够照明条件。","ans":"√"},{"n":46,"q":"遇有雨、雪、雾恶劣天气时，一般不进行接触网“V”型天窗作业。","ans":"√"},{"n":47,"q":"铁路线路安全保护区内既有建筑物、构筑物危及铁路运输安全的，应当采取必要的安全防护措施，采取安全防护措施后仍不能保证安全的，依照有关法律的规定予以拆除。","ans":"√"},{"n":48,"q":"普速铁路工务安全工作应坚持安全第一、预防为主、综合治理的方针。","ans":"√"},{"n":49,"q":"每次出车前，必须检查、试验电务车载设备（GYK、CIR、GMS）状态，核对GYK基本数据版本信息，确认状态完好，输入GYK各项参数、导入运行揭示数据文件并复核确认无误，正确选定CIR设备的运行线路、通信模式，注册车次功能号。GYK、CIR状态不良时严禁上线运行。","ans":"√"},{"n":50,"q":"在电气化铁路拨道作业，线路中心位移一次不得超过20mm，一侧拨道量年累计不得大于120mm，并满足建筑限界和线间距要求。","ans":"×"},{"n":51,"q":"天窗分为施工天窗和大修天窗。","ans":"×"},{"n":52,"q":"变更曲线超高时，当调整量大于20mm时，应分次起道捣固，且每次调整量不得大于10mm，并进行稳定作业。","ans":"×"},{"n":53,"q":"清筛机起道高度不宜超过50mm（道床厚度不足的特殊地段可适当提高）。","ans":"×"},{"n":54,"q":"机车、动车及各种车辆上方的接触网设备未停电并办理安全防护措施前，人员可以攀登到车顶或车辆装载的货物上。","ans":"×"},{"n":55,"q":"柴油发动机是以柴油作燃料的内燃机，其工作特点为空气在气缸内被压缩成高温、高压气体，使喷人的柴油自燃，并由燃气膨胀而做功。","ans":"√"},{"n":56,"q":"在检查发电机皮带，在皮带中间用手指下压，下压量为10mm～15mm为正常。","ans":"√"},{"n":57,"q":"上止点，活塞顶部在气缸中离曲轴中心距离最近的位置。","ans":"×"},{"n":58,"q":"选择机油的原则，一是黏度适当、二是冬季和夏季不同，南方和北方不同。","ans":"√"},{"n":59,"q":"活塞冲程，也称活塞行程，是活塞从上止点运动至下止点之间的距离。","ans":"√"},{"n":60,"q":"柴油发动机的每一工作循环都包括进气、压缩、做功和排气4个冲程，这4个冲程是不断重复进行的。","ans":"√"},{"n":61,"q":"在柴油发动机的一个工作循环中，只有做功冲程对外界输出功率，其他3个冲程都是为做功冲程服务的，因而只是辅助过程。","ans":"√"},{"n":62,"q":"机体组件包括机体、气缸套、气缸盖和油底壳等。","ans":"√"},{"n":63,"q":"曲柄连杆机构是柴油发动机借以产生并传递动力的机构，通过它把活塞在气缸中的直线往复运动(推力)和曲轴的旋转运动(扭矩)有机地联系起来、并由此向外输出动力。","ans":"√"},{"n":64,"q":"冷却系统根据柴油发动机气缸的工作次序，定时地开启和关闭进、排气门，以保证气缸及时排出废气和吸进新鲜空气。","ans":"×"},{"n":65,"q":"燃油供给系统主要包括喷油泵、喷油器、喷油提前器、调速器、柴油滤清器、输油泵等。","ans":"√"},{"n":66,"q":"润滑系统的任务是用机油来保证各运动零件摩擦表面的润滑，以减少摩擦阻力和零件的磨损，并带走摩擦产生的热量和磨屑。","ans":"√"},{"n":67,"q":"静止的柴油发动机需借助外力启动才能转人做功状态，启动装置就是为柴油发动机的启动提供外力和创造有利条件。","ans":"√"},{"n":68,"q":"道依茨风冷柴油发动机气缸的排列方式分直列式和V型两种。","ans":"√"},{"n":69,"q":"机型代号中的F代表采用了增压器的柴油发动机。","ans":"×"},{"n":70,"q":"由于柴油发动机运送时没带柴油，因此第一次启动前必须排气大修后的柴油发动机在第一次启动前也必须用手动输油泵进行排气。","ans":"√"},{"n":71,"q":"充注或添加柴油时，柴油须在容器内经过一昼夜以上时间的沉淀，用专用设备加油。","ans":"√"},{"n":72,"q":"道依茨柴油发动机机型代号中的“B”代表采用了增压器的柴油发动机。","ans":"√"},{"n":73,"q":"皮带挠度应小于15mm,皮带挠度大于15mm时，用19mm扳手松开张紧板紧固螺母，调整皮带挠度到合格尺寸。","ans":"√"},{"n":74,"q":"风冷柴油发动机参数测量装置包括缸盖温度测量装置、机油压力测量装置、柴油发动机转速测量装置以及柴油发动机工作小时测量装置。","ans":"√"},{"n":75,"q":"更换机油应在柴油发动机热机状态下进行。","ans":"√"},{"n":76,"q":"当气温在摄氏5℃以下时，为了顺利启动柴油发动机，将利用火焰加热塞对进气管的进气温度进行预热。","ans":"√"},{"n":77,"q":"WD-320动力稳定车中预热装置可确保柴油机在-25℃以上环境温度下直接顺利启动。","ans":"√"},{"n":78,"q":"发动机冒黑烟的原因，经常猛加油门或超负荷工作，容易造成柴油发动机工作粗暴，燃烧不良而形成积炭，使活塞环卡死而喷机油燃烧。","ans":"×"},{"n":79,"q":"新机或大修后的柴油发动机，由于活塞、活塞环与气缸套未磨合好，机油上窜到燃烧室燃烧，使排气冒蓝烟。","ans":"√"},{"n":80,"q":"进气温度高，导致进气量不足，燃烧恶化而排黑烟。","ans":"√"},{"n":81,"q":"液压传动是靠密闭容器内的液体压力能，来进行能量转化、传递与控制的一种传动方式。","ans":"√"},{"n":82,"q":"液力传动具有启动加速快而平稳、自动无级调速、换挡无冲击、隔振、减振、过载保护等优点，因此，它取代了部分机械传动装置。","ans":"√"},{"n":83,"q":"液力传动有两种形式，偶合器液力传动和变矩器液力传动。","ans":"√"},{"n":84,"q":"液力变矩器的工作油液不但要求粘度大小要适当，而且要求粘度随温度的变化要小,工作油液的温度一般应保持在80℃－110℃。","ans":"√"},{"n":85,"q":"液流经泵轮一涡轮一导轮一泵轮，在液力变矩器内循环流动不止，形成液力变矩器的正常工作。","ans":"√"},{"n":86,"q":"液力机械变速箱由液力变矩器、动力换挡机构、润滑系统和电液控制系统等部分组成。","ans":"√"},{"n":87,"q":"滤清器分为吸油滤清器和压力油滤清器两种。","ans":"√"},{"n":88,"q":"柴油发动机输出轴不能双向旋转，动力换挡机构的换向装置，能够方便地实现大型养路机械的双向行驶。","ans":"√"},{"n":89,"q":"液力机械变速箱至主传动车轴齿轮箱之间装有分动齿轮箱。","ans":"√"},{"n":90,"q":"清筛机齿轮传动箱应检查齿轮的啮合印痕，正常的啮合印痕在高度上应等于或大于齿高的65%、在长度上应等于或大于齿宽的50%。","ans":"×"},{"n":91,"q":"柴油发动机与液力机械变速箱之间空间位置固定，故采用长度可伸缩的万向传动轴。","ans":"√"},{"n":92,"q":"为了实现两轴间等角速度运动的传递，需要采用双万向节。","ans":"√"},{"n":93,"q":"花键长度应保证传动轴在各种工况下，既不脱开又不顶死，既不脱开又不顶死。","ans":"√"},{"n":94,"q": ns":"√"},{"n":161,"q":"在长大直线区段进行拨道作业时，为提高线路的准直精度，可在机器前方轨道上200～600m的距离范围内安置一个激光发射器，使拨道精度达到每300m不大于±1.5mm。","ans":"√"},{"n":162,"q":"动力稳定车一次作业后，线路的横向阻力值便恢复到作业前的80%以上，从而有效地提高了捣固作业后的线路质量。","ans":"√"},{"n":163,"q":"对碎石道床而言，当其不洁度（按重量计）超过30%时，应该进行清筛。","ans":"√"},{"n":164,"q":"SPZ-200双向配砟整形车不可以进行正、反两个方向作业。","ans":"×"},{"n":165,"q":"大型养路机械救援起复作业主要采用拉复法。","ans":"√"},{"n":166,"q":"大型养路机械作业条件相对困难，特别是线路几何尺寸误差较大，线路上石砟堆积易引起作业车脱轨，相对铁路机车车辆而言，大型养路机械更易于出现需要救援起复的事故，且救援起复有其独特性及复杂性。","ans":"√"},{"n":167,"q":"大型养路机械脱轨出现线路损坏严重或大型养路机械严重倾斜时，禁止采用拉复法。","ans":"√"},{"n":168,"q":"顶复作业包括以下四个步骤，试压、顶升、横移、复轨。","ans":"√"},{"n":169,"q":"大型养路机械起复索具多数采用4根拉力为90kN的直径¢10mm的链条即可。","ans":"√"},{"n":170,"q":"大型养路机械出现脱轨，其车架倾斜角度超过5°(垂直方向)时，不能直接进行顶复作业，而应先使用扶正油缸进行扶正。","ans":"√"},{"n":171,"q":"可以选车轴作为顶复点，因顶复时车轴易受力变形、出现压痕，可能引发行车安全隐患。","ans":"×"},{"n":172,"q":"当使用电动泵时，线盘所有电缆全部要展开，以防电流过大，烧坏电缆。","ans":"√"},{"n":173,"q":"拉复需要顶升点，拉复点可选择车钩，其位置不受其他部件干涉。","ans":"×"},{"n":174,"q":"顶复事故车时，必须由专人统一指挥，从一端顶起事故车时，另一端必须安放止轮器，以防事故车溜车。","ans":"√"},{"n":175,"q":"钢轨打磨一般是指消除钢轨周期性和非周期性短波不平顺而进行的作业。","ans":"√"},{"n":176,"q":"钢轨打磨分为校正性（修理性）打磨、保养性（轮廓性）打磨和预防性打磨三类。","ans":"√"},{"n":177,"q":"GTC-80型钢轨探伤车由牵引车和检测车通过折棚风挡连接组成。","ans":"√"},{"n":178,"q":"钢轨探伤时从各个方向上都能检测到的缺陷形状是点状。","ans":"√"},{"n":179,"q":"钢轨探伤时通常所称的游动缺陷回波是指用联合双探头探测到的。","ans":"√"},{"n":180,"q":"在一秒钟内通过一个定点的波型的个数称为频率。","ans":"√"},{"n":181,"q":"电气系统分两大部分，作业操作控制系统、辅助控制系统。","ans":"√"},{"n":182,"q":"捣固控制系统主要是控制捣固装置的下降、上升。","ans":"√"},{"n":183,"q":"主要控制起拨道装置对轨道进行拨道作业。","ans":"√"},{"n":184,"q":"起道抄平控制系统主要控制起拨道装置对轨道进行起道作业。","ans":"√"},{"n":185,"q":"柴油机的启动由车上的24V蓄电池提供，启动后由柴油机自带的三台直流小发电机并联对整车供电，同时向蓄电池充电。","ans":"√"},{"n":186,"q":"多路检测是一个40路输入的信号选择器，多路信号检测功能大部分都集中在B7控制箱上。","ans":"√"},{"n":187,"q":"故障报警电路共有14路报警信号，故障报警信号相应指示灯均在B5箱上。","ans":"√"},{"n":188,"q":"大型养路机械常用的铅酸蓄电池主要有3种，分别是普通蓄电池、干荷蓄电池和免维护蓄电池。","ans":"√"},{"n":189,"q":"捣固车作业过程中有可能由于某种故障失去动力，应急泵利用蓄电池供电提供足够的液压压力源，收起并锁定各工作装置，便于安全撤离作业区，确保线路畅通。","ans":"√"},{"n":190,"q":"大型养路机械柴油发动机未启动或低速运转时，各电气设备所需电源由蓄电池供给。","ans":"√"},{"n":191,"q":"大型养路机械上使用的柴油发动机自带发电机为整流调压一体式，具有发电、整流和调节电压功能。","ans":"√"},{"n":192,"q":"接线必须正确可靠，正、负极可以接错，否则将损坏发电机。","ans":"×"},{"n":193,"q":"DC-32k捣固车整车电源由3台发电机向蓄电池充电。","ans":"√"},{"n":194,"q":"08-475道岔捣固车用于不同处所起道装置是使用起道钩和夹轨钳相互转换。","ans":"×"},{"n":195,"q":"大型养路机械设备既具有类似机车的自行和连挂运行性能，又具有线路修理功能。","ans":"√"},{"n":196,"q":"清筛机后拨道装置由气动升降机构、液压拨道机构和安全保险器三部分组成。","ans":"√"},{"n":197,"q":"08-475型道岔捣固车有8个风缸。","ans":"√"},{"n":198,"q":"09-3X型连续式三枕捣固车的重大创新是两侧的三轨枕捣固装置，在作业过程中能同时捣固三根轨枕。","ans":"√"},{"n":199,"q":"道砟清筛机是清筛道床中道砟的作业机器，它将脏污的道砟从轨枕下挖出，进行清筛后，再将清洁道砟回填至道床，将筛出的污土清除到线路外。","ans":"√"},{"n":200,"q":"RM80全断面道砟清筛机在不拆除轨排的情况下，不能通过挖掘链运动将轨排下的道砟挖出。","ans":"×"},{"n":201,"q":"轨道不平顺分为长波不平顺及短波不平顺。","ans":"√"},{"n":202,"q":"修理性打磨是在钢轨轨头裂纹开始扩展前就把裂纹萌生区打磨掉，防止接触疲劳型波磨的产生和发展。","ans":"×"},{"n":203,"q":"同一辆车前、后车钩中心水平线高度差不得超过75mm。","ans":"×"},{"n":204,"q":"大型养路机械在运用中车钩高度调整的一般方法是在钩身磨耗板下和钩尾框托板内加调整垫。","ans":"√"},{"n":205,"q":"大型养路机械使用13号上作用式车钩和6G型车钩。","ans":"√"},{"n":206,"q":"相互挂接的两个车钩，必须有一个处于全开位，另一个处于什么位置都可以。","ans":"√"},{"n":207,"q":"钩缓装置主要附属配件有钩尾框、钩尾销、从板、从板座、冲击座、车钩托梁、钩尾框托板、车钩提杆及车钩提杆座等。","ans":"√"},{"n":208,"q":"缓冲器的工作原理是借助于压缩弹性元件来缓和冲击作用力的，同时在弹性元件变形过程中利用摩擦和阻尼吸收冲击能力。","ans":"×"},{"n":209,"q":"6G型车钩的结构与13号车钩基本相同，钩头内的零部件可以互换，不同之处在于6G型车钩的钩尾销由原来13号车钩的钩尾扁销，改为钩尾圆销。","ans":"√"},{"n":210,"q":"车钩中心水平线至钢轨顶面的高度称车钩高度，新造车辆落成后的车钩高度为(880±10)mm。","ans":"√"},{"n":211,"q":"十三号车钩的优点是具有较大的抗拉强度，静拉荷载可达2500—3000kN。","ans":"√"},{"n":212,"q":"当轮对的一个车轮轮缘紧贴一股钢轨的作用边时，另一个车轮轮缘与另一股钢轨的作用边之间便形成一定的间隙，该间隙称为游间。","ans":"√"},{"n":213,"q":"轮对内侧距离及轮位差应符合限度要求，轮对内侧距离三处测量差值不大于3mm。","ans":"√"},{"n":214,"q":"09-32捣固车用于转向架的轴箱采用八字橡胶弹簧支撑。","ans":"√"},{"n":215,"q":"轮对轴箱装置直接承受转向架(轮对除外)的载荷并传给钢轨，通过轮轨间的黏着作用产生牵引力或制动力，并通过轮对的转动实现车辆在钢轨上的运行。","ans":"√"},{"n":216,"q":"车轮踏面与钢轨顶面主要接触部分是1/20的斜坡。","ans":"√"},{"n":217,"q":"金属橡胶弹簧中的橡胶老化、龟裂、严重变形或橡胶块与金属板之间粘接脱离时，或使用满3年的，应更换金属橡胶弹簧。","ans":"√"},{"n":218,"q":"DC-32k捣固车同一车辆的各车轮直径差不得大于10mm车轮轮辋、轮缘厚度不得小于23mm。","ans":"√"},{"n":219,"q":"QS-650k全断面道砟清筛机轴箱的最高温度超过70℃(非提速)或轴箱温度高于环境温度45℃以上时，可判断为轴箱过热。","ans":"√"},{"n":220,"q":"通常是利用曲线半径、弦长、正矢之间的几何关系，用一定长度的弦线测量曲线正矢的方法，来检查线路曲线的圆顺，人工用这种方法来检查整正曲线的圆顺称为绳正法。","ans":"√"},{"n":221,"q":"08-32纵向高低检测装置由2根钢弦、两个超平传感器等组成。","ans":"√"},{"n":222,"q":"激光接收器上的光电池共有3块，横向分左右两组排列。","ans":"×"},{"n":223,"q":"大机作业前要确认数据准确，里程对应惯导小车里程，作业前把数据点起道拨道量记录好，便于顺坡。","ans":"√"},{"n":224,"q":"AI为数字量输入模块。","ans":"×"},{"n":225,"q":"DI为模拟量输入模块。","ans":"×"},{"n":226,"q":"一切建筑物、设备，在任何情况下均不得侵入铁路的建筑限界，与机车、车辆有直接互相作用的设备，在使用中不得超过规定的侵入范围。","ans":"√"},{"n":227,"q":"铁路基本限界可分为建筑限界和机车车辆限界两种。","ans":"√"},{"n":228,"q":"区间及站内两相邻线路中心线间的距离为线间距。","ans":"√"},{"n":229,"q":"曲线上建筑限界的加宽范围，包括全部圆曲线、缓和曲线和部分直线。","ans":"√"},{"n":230,"q":"目前我国使用的钢轨，抗拉强度约900Mpa。","ans":"√"},{"n":231,"q":"旅客站台上柱类建筑物离站台边缘至少1500mm，建筑物离站台边缘至少2000mm。","ans":"√"},{"n":232,"q":"在编组站、区段站及区段内选定的三至五个中间站上,单线铁路应另有一条线路,双线铁路上、下行各另有一条线路,不能通行超限货物列车。","ans":"×"},{"n":233,"q":"自动制动阀(大闸)实施间接制动的一个关键性的中间执行元件，通过均衡风缸的压力变化来控制列车管的压力变化，最终控制制动缸的压力变化，它是安全阀。","ans":"×"},{"n":234,"q":"YZ-1制动机在单独制动作用时，单独制动阀不能直接控制制动缸的压力。","ans":"×"},{"n":235,"q":"人为地使列车减速、停车或防止停留的车辆移动所采取的措施，称为制动。","ans":"√"},{"n":236,"q":"型养路机械挂运安全管理以“防松脱、防反拖、防超限、防燃轴、防抱闸、防分离、防火灾、防误碰”为核心，坚持“精心整备、逐项复核、途中监控、应急有备、确保安全”的原则。","ans":"√"},{"n":237,"q":"大型养路机械挂运时，应处于无动力状态，全程开启车轴轴箱、车轴齿轮箱等行车安全关键部件的温度报警装置，关闭轨道车运行控制设备(GYK)，关闭作业电源和作业风路。","ans":"√"},{"n":238,"q":"在满足大型养路机械技术性能、行车安全和作业需要的前提下，宜将重车、轴距大、功率大的车型编在机组前部。","ans":"√"},{"n":239,"q":"钢轨打磨列车、道岔打磨车、钢轨探伤车、钢轨铁磨车等由两节或多节固定连结而构成一台的车型挂运时，应整台编组、不得摘解。","ans":"√"},{"n":240,"q":"大型养路机械挂运时，应编挂于货物列车尾部或采用机车牵引成组专列运行，挂运速度不得超过90km/h，禁止编入旅客列车、重载列车，不得直接连挂装有危险货物的车辆，禁止溜放，禁止通过驼峰，对于禁止通过减速顶的车型，由铁路局集团公司在挂运电报中明确。","ans":"√"},{"n":241,"q":"制动作用失效或不良的大型养路机械不得挂运。","ans":"√"},{"n":242,"q":"对于装有走行分动齿轮箱的捣固车、稳定车等车型，挂运距离超过200km时，应拆除分动齿轮箱至过桥的传动轴，挂运距离超过500km时，应拆除分动齿轮箱至过桥、分动齿轮箱至车轴齿轮箱的传动轴。","ans":"√"},{"n":243,"q":"大型养路机械挂运时，应安排胜任的登乘机车人员，负责及时传递运行信息、协助处置异常情况。","ans":"√"},{"n":244,"q":"挂运是指大型养路机械在跨局作业跨局检修、施工转场、转配属、返回基地、大修送修、新造或大修出厂等情况下，处于无动力状态，编挂在货物列车尾部附挂运行或由机车牵引成组专列运行。","ans":"√"},{"n":245,"q":"制动闸瓦间隙过大或过小，造成闸瓦磨轮对或制动力不足时，调整制动缸活塞行程或制动拉杆。","ans":"√"},{"n":246,"q":"为了解决捣固车作业过程中由于前端偏移所带来的误差，ALC通过先对未作业的线路测量一遍，然后软件根据测量的参数自动优化出一条最适合当先线路状况的曲线。","ans":"√"},{"n":247,"q":"大型养路机械单台挂运时，押车负责人由运行司机及以上胜任人员担任。","ans":"√"},{"n":248,"q":"押运人员在押运前8h至押运任务结束均不得饮酒，应按规定穿戴劳动保护用品，准时到岗参加押运工作。","ans":"√"},{"n":249,"q":"押运人员包括押车负责人、登乘机车人员和押车人员。","ans":"√"},{"n":250,"q":"按车型配备必要的押车人员，单台配砟整形车挂运时不少于3名。","ans":"×"},{"n":251,"q":"按车型配备押车人员，96头钢轨打磨列车、路基处理车每台不少于4名。","ans":"√"},{"n":252,"q":"在ALC窗口，从输入方向看，基准线的左边一侧是右旋曲线，基准线的右边一侧是左旋曲线，线路方向参数的单位是mm。","ans":"√"},{"n":253,"q":"押运途中,押运人员应防止误碰紧急制动按钮、辅助制动按钮、主辅机转换阀等影响行车安全的开关按钮。","ans":"√"},{"n":254,"q":"列车在车站停车时间超过5min时，押车负责人应在设置专人防护(必要时设置驻站防护)且报告机车司机、车站值班员后，方可组织押车人员在远离正线一侧下车检查。","ans":"×"},{"n":255,"q":"大型养路机械各车在区间独自运行时，续行间隔不得少于200m。","ans":"×"},{"n":256,"q":"大型养路机械可以作其他用途牵引使用。","ans":"×"},{"n":257,"q":"大型养路机械停止自轮运行无动力回送时，须编挂在列车尾部。","ans":"√"},{"n":258,"q":"大型养路机械无动力回送时，自动制动机须状态良好，按路用车办理。","ans":"√"},{"n":259,"q":"大型养路机械必须取得年检合格证方准投入使用。","ans":"√"},{"n":260,"q":"大型养路机械由机车牵引或编挂在其他工程列车中一起运行时，必须处于无动力状态，且应加入全列车的制动系统。","ans":"√"},{"n":261,"q":"大型养路机械机组转移驻地时应安排机车或大功率轨道车牵引。","ans":"√"},{"n":262,"q":"大型养路机械禁止溜放和通过驼峰。","ans":"√"},{"n":263,"q":"大型养路机械连挂运行时应尽量将功率大、轴距大或较重的机械编排在中部。","ans":"×"},{"n":264,"q":"捣固作业结束时，严禁在圆曲线上顺坡。","ans":"×"},{"n":265,"q":"综合作业时，大型养路机械可以编挂其他作业车辆运行。","ans":"√"},{"n":266,"q":"电气化铁路区段进行架空电力线路维修、施工作业时，在与铁路长距离平行作业区段内至少每隔1km加装1组接地线。","ans":"√"},{"n":267,"q":"道岔打磨的作业区域为道岔及其前后不少于25m。","ans":"√"},{"n":268,"q":"铣磨作业走行速度应控制在1.5Km/h以内。","ans":"√"},{"n":269,"q":"在有碴桥上，枕下道碴厚度不足150mm时严禁进行捣固作业。","ans":"√"},{"n":270,"q":"机组人员出乘前24h内休息时间不得少于4h。","ans":"×"},{"n":271,"q":"大型养路机械实行铁路总公司、铁路局、段三级管理。","ans":"√"},{"n":272,"q":"使用及维护大型养路机械时，机组人员必须使用及佩戴劳动保护用品。","ans":"√"},{"n":273,"q":"大型养路机械各车在封锁区间独自运行时，续行速度不得超过40km/h。","ans":"√"},{"n":274,"q":"捣固作业结束时，可以在缓和曲线上顺坡。","ans":"×"},{"n":275,"q":"大型养路机械一般自带动力，可双向自轮运行（大修列车除外），允许作其他用途牵引使用。","ans":"×"},{"n":276,"q":"大型养路机械短距离自轮运行或由重型轨道车牵引运行时，按重型轨道车办理。","ans":"√"},{"n":277,"q":"大型养路机械车组自轮运行时，具有相同牵引特性的机械可同时用作牵引和推进的动力，由处于车组前的第一位车担当本务车，本务车驾驶员要按呼唤应答制度与后部其他大型养路机械驾驶员取得联系，确保操纵上的同步。","ans":"√"},{"n":278,"q":"大型养路机械维修施工作业的主要内容包括线路和道岔的起道、拨道、捣固，道床碴肩夯拍，边坡清筛，道床稳定、配碴、整形和钢轨、道岔打磨等。","ans":"√"},{"n":279,"q":"线路道床严重板结地段（一次下插镐头不能进入枕底面以下可视为严重板结道床），可以使用大型养路机械进行捣固作业。","ans":"×"},{"n":280,"q":"在技术状态不良的桥梁上及在线路水平严重不良地段，可以进行稳定作业。","ans":"×"},{"n":281,"q":"道岔维修捣固作业范围包括岔区及其前后各50m的线路。","ans":"√"},{"n":282,"q":"新轨或波磨深度不超过0.3mm时，采用预防性打磨方式，否则应采用修理性打磨方式。","ans":"√"},{"n":283,"q":"预防性打磨的作业遍数一般为3遍，修理性打磨的作业遍数一般不少于5遍。","ans":"√"},{"n":284,"q":"大型养路机械作业前，工务段需进行配合工作，拆除道口铺面、护轮轨、护木以及线路中心线两侧3.5m范围内妨碍机械作业的一切设施。","ans":"√"},{"n":285,"q":"使用清筛机清筛道床，枕下清筛深度一般不小于300mm，使用大修列车更换轨枕，轨枕长度不得超过2600mm，枕端露筋不得长于5mm，换枕后轨枕间距误差不大于±10mm。","ans":"√"},{"n":286,"q":"大修列车车组运行由机车牵引，作业时自行。","ans":"√"},{"n":287,"q":"在施工作业中，当捣固车发生故障不能马上修复时，工务段应及时恢复线路，使之达到放行列车的要求。","ans":"×"},{"n":288,"q":"对发生故障的大型养路机械，在故障处理以后，由处理人员及时填写《大型养路机械故障及处理情况记录》。","ans":"√"},{"n":289,"q":"严禁任何人争抢上、下大型养路机械或在大型养路机械运行时将身体探出车外，需要瞭望时应抓紧扶牢，不允许在车帮上或架空物上坐卧，不允许头脚伸出车外，不准在车上打闹。","ans":"√"},{"n":290,"q":"机组返回车站在停留线停稳后，应采取驻车制动，并按规定设置防护，完成当日保养工作。机组人员撤离前，各车必须连挂制动，上好止轮器，防止车组溜逸，并锁好车门。","ans":"√"},{"n":291,"q":"在空线上调车牵引运行时，速度为40km/h，推进运行时为30km/h，在尽头线调车时，距线路终端应有大于10m的安全距离。遇特殊情况必须小于10m时，应严格控制速度。","ans":"√"},{"n":292,"q":"线路条件应满足静态轨距偏差不超过+12-6mm，静态三角坑偏差不大于10mm，轨缝不大于30mm，曲线目视圆顺、无反超高。","ans":"√"},{"n":293,"q":"在距牵引供电设备高压带电部分2m以外，与回流线、架空地线、保护线1m以外，临近铁路营业线作业时，牵引供电设备可不停电，但须按照铁路营业线施工安全管理有关规定执行。","ans":"√"},{"n":294,"q":"电气化区段上水、保洁、施工等作业，可以将水管向供电线路方向喷射，站车保洁可以采用向车体上部喷水方式洗刷车体。","ans":"×"},{"n":295,"q":"牵引供电设备故障时，与牵引供电设备相连接的支柱、接地引下线、综合接地线等可能出现高电压，未采取安全措施前，禁止与其接触，并保持安全距离。","ans":"√"},{"n":296,"q":"动力元件的作用是将原动机的机械能转换成液体的压力能，指液压系统中的油泵，它向整个液压系统提供动力。","ans":"√"},{"n":297,"q":"液压泵的结构形式一般有齿轮泵、叶片泵和柱塞泵。","ans":"√"},{"n":298,"q":"执行元件(如液压缸和液压马达)的作用是将液体的压力能转换为机械能，驱动负载作直线往复运动或回转运动。","ans":"√"},{"n":299,"q":"液压阀可分为压力控制阀、流量控制阀和方向控制阀、时间控制阀。","ans":"×"},{"n":300,"q":"GTC型钢轨探伤车45º横波声束主要用于探测轨腰部分缺陷，70º横波声束探测轨头及轨腰上部区域。","ans":"√"},{"n":301,"q":"没有支撑的有旋转抛带的车辆（卸料车、斗式车）是不允许进行速度大于30km/h运输的。","ans":"√"},{"n":302,"q":"多桥传动是指两根以上的轴驱动的车辆。","ans":"√"},{"n":303,"q":"大型养路机械快速运行动力传动系统主要采用了两种传动方式一种是液力机械传动方式，另一种是闭式液压传动方式。","ans":"√"},{"n":304,"q":"固车低速走行的传动方式是液压传动,高速运行的传 的作用是结构相对独立，易于从车辆底架下推进、推出，便于检修。","ans":"√"},{"n":363,"q":"临时补修指以小型养路机械为主要作业手段，对轨道几何不平顺超过临时补修容许偏差管理值及其他不良处所进行的临时性整修，以保证行车安全和平稳。","ans":"√"},{"n":364,"q":"对线路、道岔（调节器）平面和纵断面进行测设及优化，通过全面起道、拨道、改道、捣固、稳定，调整几何形位，改善道床弹性。混凝土枕地段，捣固前撤除所有调高垫板。","ans":"√"},{"n":365,"q":"预防性打磨是对钢轨进行的周期性打磨，按目标廓形打磨钢轨，消除已产生的表面裂纹，减缓曲线钢轨侧面磨耗，预防产生波磨、剥离掉块、肥边等病害，延缓滚动接触疲劳裂纹产生和发展。","ans":"√"},{"n":366,"q":"线路设备大修施工必须认真贯彻执行“安全第一、预防为主”的方针，严格执行各项施工作业标准，科学组织施工，确保施工安全、质量和进度。","ans":"√"},{"n":367,"q":"施工三检制——在每次开工前、施工中和线路开通前，班组长应组织有关人员分别按分工地段对施工准备、施工作业方法、线路设备状态和线路开通条件进行检查。","ans":"×"},{"n":368,"q":"施工单位应建立健全各种施工、运输和装卸机械的管理制度，加强设备台账和技术档案的管理，实行岗位责任制，严格执行设备检修保养制度，保证配件储备，提高设备完好率。","ans":"√"},{"n":369,"q":"工务机械段负责大型养路机械作业项目。工务段负责大型养路机械作业地段的工作量调查、维修计划制订、维修方案设计、质量验收及其他作业项目。","ans":"√"},{"n":370,"q":"特殊条件下轨距加宽递减，铁路局集团公司可根据具体情况规定，但不得大于2‰。","ans":"√"},{"n":371,"q":"钢轨伤损按程度分为轻伤、重伤和折断三类。","ans":"√"},{"n":372,"q":"线路标志及信号标志的式样应符合通用参考图的规定，并保持完整、位置正确、标志鲜明。标记设置应齐全、正确、清晰。","ans":"√"},{"n":373,"q":"信号标志，设在列车运行方向右侧（警冲标除外）。","ans":"×"},{"n":374,"q":"清筛机、配砟整形车、捣固车、动力稳定车作业应采取流水作业方法，使道床在清筛后及时得到补砟、捣固和稳定，使线路尽快达到放行列车的条件。","ans":"√"},{"n":375,"q":"整流因为定子线圈中产生的电是交流电，它不能用于车辆上安装的直流电器装置，所以利用整流器将交流电变为直流电。","ans":"√"},{"n":376,"q":"无缝线路地段，作业后应及时安排无缝线路应力放散，使无缝线路锁定轨温满足设计锁定轨温范围要求。","ans":"√"},{"n":377,"q":"捣固车一次起道量不宜超过50mm，起道量超过50mm时应分次起道捣固，一次拨道量不宜超过80mm，曲线地段上挑、下压量应尽量接近，每次作业后应进行道床动力稳定。","ans":"√"},{"n":378,"q":"采用大型养路机械进行线路维修作业时，应拆除所有调高垫板，全面起道，全面捣固。","ans":"√"},{"n":379,"q":"钢轨预打磨应在新钢轨上道使用后尽快进行，一般不宜超过10Mt通过总质量。钢轨预打磨，应合理确定打磨遍数，一次打磨到位，钢轨顶面打磨量宜为0.2～0.3mm。","ans":"√"},{"n":380,"q":"在电气化铁路进行换轨、换枕作业时接触网不用停电。","ans":"×"},{"n":381,"q":"打磨面最大宽度，轨头顶面中心线两侧各10mm区域内为10mm，轨头顶面中心线两侧各10～25mm区域内为7mm，其余区域为5mm。","ans":"√"},{"n":382,"q":"轨道几何不平顺动态检测项目包括高低、轨向、轨距、水平、三角坑、复合不平顺、轨距变化率、车体垂向振动加速度、车体横向振动加速度等。","ans":"√"},{"n":383,"q":"分析液力变矩器的工作过程后，可以较方便地分析液力变矩器的变矩原理及自动适应性问题。","ans":"√"},{"n":384,"q":"接车进路及接发车进路色灯信号机的显示与进站色灯信号机不同。","ans":"×"},{"n":385,"q":"起阻挡列车运行作用的调车信号机，应采用矮型三显示机构，增加红色灯光或用红色灯光代替蓝色灯光，当该信号机的红色灯光熄灭、显示不明或显示不正确时，应视为列车的停车信号。","ans":"√"},{"n":386,"q":"进站、出站、进路、驼峰及调车色灯复示信号机均采用方形背板，以区别于一般信号机。","ans":"√"},{"n":387,"q":"接近连续式机车信号机的显示方式与连续式机车信号机不同。","ans":"×"},{"n":388,"q":"LKJ屏幕显示器的机车信号显示应与机车信号机的显示含义相同。","ans":"√"},{"n":389,"q":"机车信号设备通过接收地面设备传送的信息，经译码处理后在司机室内复示地面信号显示，进而大大改善了司机瞭望条件，使司机能够在任何条件下从容地驾驶列车，根据前方信号机的变化及时采取相应措施。","ans":"√"},{"n":390,"q":"车载计算机ALC为了适应不同车型的作业，服务程序对话框中“机器参数设置”可以修改机器的各种基本参数。","ans":"√"},{"n":391,"q":"所有控制功能都可以显示在触摸屏上，通过计算机手动或自动控制。","ans":"√"},{"n":392,"q":"打磨车JUPITER控制系统，主要由分布式输入/输出器件组成。","ans":"√"},{"n":393,"q":"脉冲宽度调制（PWM）是控制功率与负载的量的一种方法，不会浪费负载驱动器的功率。","ans":"√"},{"n":394,"q":"诊断屏幕属于Jupiter控制系统，可用于Jupiter控制系统控制和监控电气系统和电子部件的故障情况。","ans":"√"},{"n":395,"q":"大多数情况下故障发生时，可以通过诊断屏幕来检查，网络诊断屏幕会自动显示在显示屏上，操作员可以选择查看发生故障模块的详细信息，判断哪里发生开路。","ans":"√"},{"n":396,"q":"当断路发生时，数字输出模块会锁定和报告断路错误状态，只要JAM仍旧发出开启指令，短路状态会被清除并重新启动，在诊断信息表中错误计数会增加，这表示间歇的短路。","ans":"√"},{"n":397,"q":"其他视图应该有针对性，有独立存在的意义，按照表达完整性和便于看图的原则，补充主视图的不足。","ans":"√"},{"n":398,"q":"基轴制，基本偏差为一定的孔的公差带，与不同基本偏差轴的公差带形成各种配合的一种制度。","ans":"×"},{"n":399,"q":"基孔制，基本偏差为一定的轴的公差带，与不同基本偏差孔的公差带形成各种配合的一种制度。","ans":"×"},{"n":400,"q":"铸件在浇铸时，壁厚处冷却慢，易产生缩孔，或在壁厚突变处产生裂纹，要求壁厚一致或均匀变化。","ans":"√"},{"n":401,"q":"钻孔时，孔的轴线应与被加工表面垂直，并均匀受力，以保证孔的加工精度，同时保证钻头的寿命。","ans":"√"},{"n":402,"q":"按故障发生的时间性分，故障可分为突发性故障和渐进性故障。","ans":"√"},{"n":403,"q":"机械设备在使用过程中，由于零件的磨损和变形都可能造成相互之间的某种失调，润滑剂会逐渐脏污、变质，某些螺栓联接可能出现松动等，这些情况的出现和发展，都将加速机械设备的损坏，导致故障率的提高。","ans":"√"},{"n":404,"q":"零件的磨损过程由于随摩擦形式、环境条件和表面接触状况的不同而有很大区别，按其表面物质损失的不同机理分为粘着磨损、磨料磨损、表面疲劳磨损、腐蚀磨损等。","ans":"√"},{"n":405,"q":"夯实装置用于捣固钢轨两侧的枕底道碴，提高枕底道碴的密实度，并与起拨道装置相配合，消除轨道的高低不平，增强轨道的稳定性。","ans":"×"},{"n":406,"q":"双枕捣固装置是从单枕捣固装置捣固装置发展起来的一种结构先进的偏心连杆摇摆振动、异步夹持式捣固装置。","ans":"√"},{"n":407,"q":"内、外夹持油缸的夹持动作，是由各自独立的液压控制回路单独进行的，它们相互之间没有机械或液压同步结构，两侧捣固镐的夹持移动距离，因道床阻力的不同有所不同，所以称为同步夹持。","ans":"×"},{"n":408,"q":"起、拨道装置可以单独进行起道或拨道单项作业。在无起道量的单项拨道作业时，也要设置20mm左右的起道量。","ans":"×"},{"n":409,"q":"起道油缸是单作用油缸，起道力是油缸的拉力，起、拨道装置的下降依靠自重。","ans":"√"},{"n":410,"q":"磨轨有两个主要目的，一是维持轨型和二是减低表面缺陷如轨道波磨，维持好轨型和轨面使滚动声和动态负荷减到最低，得到的经济效益如延长铁轨寿命，减低燃油消耗和减少车辆维修等。","ans":"√"},{"n":411,"q":"XM-1800钢轨铣磨车采用圆周铣磨的原理对钢轨轮廓进行定制整形，能在工作行进中对线路上的钢轨进行动态铣磨，消除钢轨的侧磨、波磨、碾压层等缺陷，从而恢复轨头工作部分的设计形状,达到提高钢轨使用寿命。","ans":"√"},{"n":412,"q":"道岔打磨车采用全液压传动是为了更好地适应道岔区，如岔尖、岔心和护轮轨等处特殊打磨作业需要和精度要求，使打磨头布置更加紧凑，更有利于解决打磨集尘和系统散热问题。","ans":"√"},{"n":413,"q":"大修列车由材料车、动力车、作业车、扣件收集车、龙门吊车和若干辆轨枕运输车组成。在高速运行时，大修列车需机车牵引，自身动力不可作业走行和低速调车。","ans":"×"},{"n":414,"q":"前慢行时，分别将作业起点、终点的8个和12个轨枕盒内的道碴扒平至轨枕底，以减少换枕作业机构切人和切出时的平碴量。","ans":"√"},{"n":415,"q":"在柴油发动机的一个工作循环中，只有压缩冲程对外界输出功率，其他3个冲程都是为做功冲程服务的，因而只是辅助过程。","ans":"×"},{"n":416,"q":"配气机构是根据柴油发动机气缸的工作次序，定时地开启和关闭进、排气门，以保证气缸及时排出废气和吸进新鲜空气。","ans":"√"},{"n":417,"q":"道依茨风冷柴油发动机气缸的排列方式分直列式和V型两种，机型代号中的V代表直列式排列，不标注表示R型排列。","ans":"×"},{"n":418,"q":"经常猛加油门或超负荷工作，容易造成柴油发动机工作粗暴，燃烧不良而形成积炭，使活塞环卡死而喷机油燃烧。","ans":"√"},{"n":419,"q":"液压传动的原理是在密闭环境中，向液体施加一个力，这个液体会向各个方向传递这个力，力的大小变化，从而起到举起重物的效果。","ans":"×"},{"n":420,"q":"驱动元件的作用是将原动机输人的机械能转变成液体的压力能，为液压系统提供动力。","ans":"√"},{"n":421,"q":"液压马达在原动机的带动下，将输人的机械能转换成液体的压力能，液压泵是将液体的压力能转换成旋转运动的机械能，驱动工作机构转动液压缸则是将液体的压力能转换为往复直线运动的机械能，实现工作机构的往复直线运动。","ans":"×"},{"n":422,"q":"能量输人部件称为泵轮，它接受柴油发动机传来的机械能，并将其转换为液体的动能能量输出部件称为涡轮，它将液体的动能转换为机械能而输出。","ans":"√"},{"n":423,"q":"液力传动具有启动加速快而平稳、自动无级调速、换挡无冲击、隔振、减振、过载保护等优点，因此，它取代了部分机械传动装置。","ans":"√"},{"n":424,"q":"为了提高液力变矩器在高转速比时的传动效率，大型养路机械上用的液力机械变速箱中设有闭锁离合器。","ans":"√"},{"n":425,"q":"在快速运行动力传动系统中，分动齿轮箱的作用是将液力机械变速箱输出的动力通过传动轴分别传递给主动转向架的两个主传动车轴齿轮箱，驱动轮对运行。","ans":"√"},{"n":426,"q":"柴油发动机不能在有外载荷的条件下启动，在动力换挡机构处于空挡时，能够切断传动系统中的动力，便于柴油发动机启动，也有利于安全停车。","ans":"√"},{"n":427,"q":"传动轴一般为空心轴，用无缝钢管制成，在传递同样大小的扭矩时，空心轴具有更大的刚度，重量轻，节约钢材。","ans":"√"},{"n":428,"q":"转向架是能相对车体回转、且具有独立结构的走行装置，通常安置在车体底架两端下方，用以承载车体重量和传递走行动力。","ans":"√"},{"n":429,"q":"液压减振器是一种良好的减振装置，它能够消耗振动能量，衰弱振动振幅，实现减振作用。而且，振动速度越高，振幅越大，减振效果越不显著。","ans":"×"},{"n":430,"q":"设有轨道电路的线路，安装轨距杆时，应使用绝缘轨距杆。","ans":"√"},{"n":431,"q":"这种中心销结构的优点是，捣固车能顺利地通过曲线半径较小的线路，并且能防止转向架的点头振动传给车体，提高了捣固车的运行平稳性。","ans":"√"},{"n":432,"q":"轮缘和踏面是和钢轨直接接触的部分，为使轮对在钢轨上平稳运行，顺利通过曲线，降低轮箍磨耗，轮缘和踏面应有合理的外形。","ans":"√"},{"n":433,"q":"车轴受力很复杂，多数车轴的折损是由疲劳引起的，一般车轴的断裂发生在轴颈的圆肩部分、轮座的外缘部分和车轴的中央，因此，必须定期对车轴进行探伤检查。","ans":"√"},{"n":434,"q":"转向架构架均采用焊接结构，由于焊接工艺、结构设计和运用等方面的原因，在弯角处、吊座耳孔处、原有焊缝缺陷处等受力较大部位容易产生应力集中，在往复动载荷作用下容易出现裂纹。","ans":"√"},{"n":435,"q":"运用中的大型养路机械每年年修时须对车轴施行全轴磁粉探伤检查一次。","ans":"×"},{"n":436,"q":"踏面擦伤的主要原因是制动力过强、车轮抱闸滑行或缓解不良等原因造成。","ans":"√"},{"n":437,"q":"钩缓装置各零部件产生损伤后，若不及时发现修复，就会影响钩缓装置的正常使用，特别是裂纹，会引车钩零部件断裂，造成列车发生分离事故。","ans":"√"},{"n":438,"q":"车辆摘解时，两车钩中至少有一个车钩呈全开位置，然后牵动任一车辆，随着车辆的移动，开锁位置的车钩钩舌绕钩舌销转动，两车钩分离。","ans":"×"},{"n":439,"q":"道岔轨型应与线路钢轨轨型不同，轨型不同时应用异型钢轨过渡。","ans":"×"},{"n":440,"q":"制动时，制动缸活塞杆伸出的长度称为制动缸活塞行程，行程的大小取决于各杠杆圆销、孔距的尺寸和闸瓦与车轮之间的缓解间隙。","ans":"√"},{"n":441,"q":"调整活塞行程就是对闸瓦的缓解间隙进行调整。","ans":"√"},{"n":442,"q":"大型养路机械活塞行程的调整都是通过调节基础制动装置的上、下拉杆的调整螺母来实现的。在运用车辆上，一般只需调整下拉杆。","ans":"√"},{"n":443,"q":"手制动反转手轮时可使基础制动装置呈制动状态。","ans":"×"},{"n":444,"q":"小闸的转换柱塞沟通了均衡风缸管至作用柱塞的通路，从而使该制动阀能控制均衡风缸的充风和排风。","ans":"×"},{"n":445,"q":"把空气制动阀当做单独制动阀-大闸使用时，由于不利用电联锁的功能，而运转位与保压位的风路通断状况又相一致，故两个位置的作用相同，均起保压作用。","ans":"×"},{"n":446,"q":"YZ-1型空气制动机中，紧急制动阀是施行紧急制动作用的操纵部件，其作用就是控制大型养路机械单机或所牵引的车列发生紧急制动作用时，使之迅速停车。","ans":"√"},{"n":447,"q":"在紧急制动时加快制动主管的排风，提高紧急制动波速和紧急制动的灵敏度，使紧急制动作用可靠。","ans":"√"},{"n":448,"q":"自动制动作用是把小闸手柄放在缓解后的制动位，操纵大闸手柄在各工作位置时的综合作用。用于大型养路机械牵引他车时操纵整个列车的制动、保压与缓解。","ans":"×"},{"n":449,"q":"自动制动后的单独缓解是指用大闸操纵全列车制动后，通过下压小闸的手柄来单独缓解本车的制动力，而不影响他车制动的综合作用。","ans":"×"},{"n":450,"q":"当自阀手柄放在制动区，列车管减压时，主阀大模板活塞上、下方的压力失去平衡，在工作风缸压力空气的作用下，大模板活塞推动顶杆、带动小膜板活塞和空心阀杆向上移动，开启供气阀口。","ans":"√"},{"n":451,"q":"分配阀副阀缓解位，制动后缓解时列车管增压后进入到副阀膜板左侧，副阀膜板左右两侧产生压差，膜板右移，工作风缸压力空气给降压风缸充风。","ans":"√"},{"n":452,"q":"阀部动作后，作用风缸压力空气排出，当其压力小于24KPa后，充气阀柱塞下落，局减室的压力空气经柱塞尾部排气口排空。","ans":"√"},{"n":453,"q":"分配阀紧急部充气缓解位，列车管增压时，压力空气充入到鞲鞴上部，并通过充气限制堵向紧急风缸和膜板下侧充气，此时膜板处于下极端位置。","ans":"√"},{"n":454,"q":"机械的各种作业操作是由程序控制系统按照作业操作的要求发出各项指令，统一指挥和协调全车的机械有条不紊的工作。","ans":"√"},{"n":455,"q":"故障报警电路主要是检测全车各种对行车安全和作业安全有重要影响的信号，一旦这些信号出现，相应的指示灯点亮并产生声音报警提醒操作者处理。","ans":"√"},{"n":456,"q":"全车供电中有三种电源板，EK-812SV、EK-813SV和EK-T5083。","ans":"√"},{"n":457,"q":"马达与泵在原理上有可逆性，但因用途不同结构上有些差别，马达要求正反转，其结构具有对称性，而泵为了保证其自吸性能，结构上采取了某些措施。","ans":"√"},{"n":458,"q":"单杆活塞缸只有一端带活塞杆，它也有缸筒固定和活塞杆固定两种安装方式，两种方式的运动部件移动范围均为活塞有效行程的两倍。","ans":"√"},{"n":459,"q":"电液换向阀是由电磁换向阀与液动换向阀组合而成，液动换向阀实现主油路的换向，称为主阀。","ans":"√"},{"n":460,"q":"电液伺服阀由电气－机械转换装置、液压放大器和反馈（平衡）机构三部分组成。","ans":"√"},{"n":461,"q":"液压放大器接受小功率的转角或位移信号，对大功率的液压油进行调节和分配，实现控制功率的转换和放大。","ans":"√"},{"n":462,"q":"反馈平衡机构使阀输出的流量或压力与输入信号成比例。","ans":"√"},{"n":463,"q":"蓄能器的分类按产生液体压力的方式分弹簧式、重锤式和充气式。常用充气式，它利用气体的压缩和膨胀储存、释放压力能。","ans":"√"},{"n":464,"q":"吸收冲击和脉动的蓄能器应尽可能安装在振源附近。","ans":"√"},{"n":465,"q":"蓄能器的基本功能是储存工作介质，散发系统工作中产生的热量，分离油液中混入的空气，沉淀污染物及杂质。","ans":"×"},{"n":466,"q":"泵的吸油管与系统回油管之间的距离应尽可能远些，管口都应插于最低液面以上，但离油箱底要大于管径的2-3倍，以免吸空和飞溅起泡。","ans":"×"},{"n":467,"q":"液压系统的加热一般采用结构简单、能按需要自动调节最高和最低温度的电加热器。","ans":"√"},{"n":468,"q":"由于油液是热的良性导体，单个加热器的功率容量不能太大，以免其周围油液的温度过高而发生变质现象。","ans":"×"},{"n":469,"q":"液压油应有较好的粘温性，良好的润滑性，质量纯净，杂质少，对金属和橡胶的腐蚀性小，不易氧化，对人体无害，环境温度较高时闪点要高，环境温度较低时凝点要低，应具有良好的抗乳化性和消泡性。","ans":"√"},{"n":470,"q":"起拨道装置的液压油缸回路可以分为拨道油缸电液伺服控制回路、起道油缸电液伺服控制回路及夹轨钳油缸回路。","ans":"√"},{"n":471,"q":"当线路方向检测和修正信号与反馈信号相比较有偏差时，系统就工作。电液伺服阀的输出流量与输入的偏差电信号成比例。偏差信号由正（负）变为负（正）时，电液伺服阀的输出流量改变方向，则拨道油缸的运动方向也改变。","ans":"√"},{"n":472,"q":"气压传动系统的介质是空气，它取之不尽用之不竭，成本较低，用后的空气可以排到大气中去，会污染环境。","ans":"×"},{"n":473,"q":"空压机从大气中吸入的空气经过压缩传送到空压系统时，含有以蒸汽状态存在的水份，这是有利因素。","ans":"×"},{"n":474,"q":"工务机械车挂运安全管理以“防松脱、防反拖、防超限、防燃轴、防抱闸、防分离、防火灾、防误碰、防偏载”为核心，坚持“精心整备、逐项复核、全程监控、应急有备、确保安全”的原则。","ans":"√"},{"n":475,"q":"工务机械车跨局作业、跨局检修、施工转场、转配属、返回基地、大修送修时，挂运通知由使用单位发布，新造或大修出厂时，挂运通知由集团公司发布。","ans":"×"},{"n":476,"q":"工务机械车挂运时可以编入旅客列车、重载列车，不得与运输危化品、易燃易爆品车辆直接连挂，禁止溜放，禁止通过驼峰、减速顶。","ans":"×"},{"n":477,"q":"列车运行期间可以打开轨道车运行控制设备（GYK），接通作业电源和作业风路，严禁启动牵引发动机。","ans":"×"},{"n":478,"q":"挂运途中发生制动故障时，运用单位应积极处置，因无法处置需临时停止制动作用时，运用单位应主动向车站和停车作业列检作业场报告相关情况，并执行《铁路技术管理规程》相关规定。","ans":"√"},{"n":479,"q":"宿营车专（兼）职检车员应由职工担任，并经过客车管理单位（部门）的专项培训，经考核合格并在《铁路岗位培训电子证书》登记后方可上岗。","ans":"√"},{"n":480,"q":"挂运机组应至少配备1套液压起复设备（具有顶升和横移机构、具有手动和电动功能）、1套人字形复轨器、4个止轮器、2个手拉葫芦（不小于3吨）、枕木头及撬棍若干。","ans":"√"},{"n":481,"q":"宿营车转场挂运前，须确认缓解阀处于导通位置，并捆绑缓解阀手柄，撤除生活水管、供电电缆、电话网络线路、车辆临时附挂件、跨车钩交叉连接的加长电力连接线加长水管和车钩苫盖等设施。","ans":"√"},{"n":482,"q":"使用单位应建立挂运信息联控机制，明确联控时机、联控用语等相关内容，确保押运途中信息传递畅通、高效。","ans":"√"},{"n":483,"q":"列车由车站开出时，各车押车人员须按编组顺序逐一向押车负责人报告本车风压、轴箱及车轴齿轮箱温度等车辆状态信息。","ans":"√"},{"n":484,"q":"况紧急时，押车人员应立即采取紧急制动措施，并立即向押车负责人报告相关情况，押车负责人应及时向机车司机报告相关情况。宿营车发生危及行车安全的故障及隐患时，押运负责人还应及时通报西安客车车辆段派员现场处理。","ans":"√"},{"n":485,"q":"工务机械车转场途中，段线路科应通过车站监控、钉钉视频等方式，全过程管控工务机械车动车前连挂试风、押运途中车辆状态及人员履责情况。","ans":"×"},{"n":486,"q":"本列有机车时，严禁安排人员钻入车下。确有必要钻入车下时，应向车站申请甩车处理。","ans":"√"},{"n":487,"q":"轨道电路是利用铁路的两条钢轨作为导体所构成的电气回路。它可以反映线路和道岔区段是否有车占用，钢轨是否完整。","ans":"√"},{"n":488,"q":"机车信号机简称八灯显示器，安装于驾驶操作台正前方，便于正、副司机瞭望。机车信号机点灯电压为15V。","ans":"×"},{"n":489,"q":"非驾驶司机室内的空气制动阀（自动制动阀、单独制动阀）手柄不用取出。","ans":"×"},{"n":490,"q":"特殊情况下的驶离。为避免车轮在钢轨上打滑，可以使用第二挡，甚至第三挡。钢轨潮湿或有油时，建议采用这种方式。","ans":"√"},{"n":491,"q":"强制降速并停止运行期间，速度挡位必须转换，待车完全停稳后再将挡位选择器置于空挡位。即在任一挡内均可实施制动停车。","ans":"×"},{"n":492,"q":"车站开车确认全列编组、设备情况，输入列车车次并再次确认GYK行车有关数据输入是否正确，机车信号上下行开关位置是否与运行区段一致。","ans":"√"},{"n":493,"q":"在长大上坡道上运行，应采用“先闯后爬、闯爬结合”的操纵方法。应充分利用线路纵大型养路机械断面的有利地形，提前增大牵引力，提高运行速度，利用动能闯坡。","ans":"√"},{"n":494,"q":"引导接车后需从车站通过时，若前方区间停止基本闭塞改用电话闭塞时，凭车站值班员显示的通过手信号和递交的路票进入下一个运行区间。","ans":"√"},{"n":495,"q":"站内停车时，初次减压量不得高于最小减压量，追加减压量不得超过初次减压量，累计减压量不得超过最大减压量。","ans":"×"},{"n":496,"q":"机械车在中间站转线、编组时按调车办理。机械车可以担当除本列以外的调车作业。","ans":"×"},{"n":497,"q":"大型养路机械分解、连挂地点应选择在平直线路上或坡度较大和曲线超高较小的地段。","ans":"×"},{"n":498,"q":"直流轨道电路又分为普通直流轨道电路和直流脉冲轨道电路。","ans":"√"},{"n":499,"q":"轨道电路是信号基础安全设备，轨道电路是利用钢轨作为导体构成的电路系统，通过列车轮对与钢轨接触形成电气短路，引起接收端电气状态变化实现区段占用空闲检查。","ans":"√"},{"n":500,"q":"当轨道电路不完整时，断轨、断线或绝缘破损时，轨道继电器应立即释放衔铁，关闭信号。","ans":"√"},{"n":501,"q":"在站线超限绝缘作业时如果联电，相连的正线信号相继变化，造成信号机突变，影响机车行驶。","ans":"√"},{"n":502,"q":"电气化区段的分割绝缘均视为超限绝缘。","ans":"×"},{"n":503,"q":"在轨道电路区段作业时，必须与供电部门取得联系，主动沟通，防止混电现象发生。","ans":"×"},{"n":504,"q":"发生事故或遭遇意外灾害，主要配件破损严重，不能恢复基本性能的大型养路机械及时进行报废处理工作。","ans":"√"},{"n":505,"q":"大型养路机械除作业自轮运行外，可以用作其他用途牵引车使用。","ans":"×"},{"n":506,"q":"在打磨侧股时，对直股已经打磨过的尖轨专辙部分可跳过，交叉渡线和翼轨高于基本轨的区域不打磨。","ans":"√"},{"n":507,"q":"高铁线路作业，每周作业前应对捣固车执行机构和测量误差进行标定并满足要求。","ans":"×"},{"n":508,"q":"使用大型养路机械时，大型养路机械及其各种安全辅助自救设备必须齐全、完好、失效。","ans":"×"},{"n":509,"q":"铁路营业线施工是指影响营业线设备稳定、使用和行车安全的各种作业，按组织方式、影响程度分为施工和维修两类。","ans":"√"},{"n":510,"q":"调车信号开放后或调车手信号显示后，方可将GYK设置为“调车模式”，调车结束后退出“调车模式”。","ans":"√"},{"n":511,"q":"可以反向驾驶，不得中断瞭望，防止冒进信号或越出站界，需越出站界调车时，严格按有关规定办理。","ans":"×"},{"n":512,"q":"推进附挂车辆运行时，应指定班组长登乘车组前端安全位置，认真瞭望，及时与司机联系，必要时通知司机停车或使用简易紧急制动阀停车。","ans":"×"},{"n":513,"q":"自轮运转车辆及附挂车辆收、放工作装置及作业、调试设备时，应统一指挥，做好车上与地面人员协调。","ans":"√"},{"n":514,"q":"站停过夜时，原则上可以进行调车作业。","ans":"×"},{"n":515,"q":"自轮运转车辆运用单位应落实一次出乘作业标准，应用远程运用管理系统、GYK数据、音视频及TDCS等手段，规范司机标准化作业。","ans":"√"},{"n":516,"q":"自轮运转车辆车顶两端应安装黄色警示灯或声光报警设备，遇有降雾、暴风雨（雪）、扬沙等恶劣天气及夜间运用时应开启,在夜间或隧道作业时，现场应有充足的照明。","ans":"√"},{"n":517,"q":"清筛机、物料运输车、配砟整形车、路基处理车作业中，遇接触网支柱、拉线、信号机等行车设备时，应安排专人负责指挥，防止刮碰。","ans":"√"},{"n":518,"q":"线间距不足4.2m时，边坡清筛机靠邻线一侧的工作装置不得作业。","ans":"×"},{"n":519,"q":"线间距不足4.9m时，配砟整形车靠邻线一侧的犁板严禁作业。","ans":"×"},{"n":520,"q":"清筛、更换道床、换枕作业起终点应避开缓和曲线，宜避开小半径曲线超高较小的地段。","ans":"×"},{"n":521,"q":"应在作业起、终点划上标记，按规定顺坡，不宜在圆曲线上顺坡，可以在缓和曲线上顺坡。","ans":"×"},{"n":522,"q":"向施工封锁区间开行路用列车，原则上每端只准进入一列，如超过时，其安全措施及运行办法由铁路局集团公司规定。","ans":"√"},{"n":523,"q":"遇特殊情况不能立即撤出线路时，在前后两个方向，按线路最大速度等级规定的列车紧急制动距离位置以停车手信号防护，自动闭塞区段还应使用短路铜线短路轨道电路。","ans":"√"},{"n":524,"q":"作业人员在桥梁作业通道上应集中走行。","ans":"×"},{"n":525,"q":"与本线相邻的其他站线来车时可不下道，但必须停止作业。列车进路不明时必须下道避车。","ans":"√"},{"n":526,"q":"人员和工机具严禁侵入高速铁路建筑限界，需侵入高速铁路建筑限界时，封锁相邻高速铁路。","ans":"√"},{"n":527,"q":"严禁作业人员跳车、钻车、扒车和由车底下、车钩上传递工具材料,休息时不得坐在钢轨、道心、轨枕头及道床边坡上。","ans":"√"},{"n":528,"q":"隧道内组织多项目、多台机械同时作业时，必须互相通报作业地点、作业内容。自行机械应高速运行，以免互相碰撞。","ans":"×"},{"n":529,"q":"在电气化区段作业时，长轨列车必须安装屏蔽装置，轨道吊必须安装限位装置。","ans":"√"},{"n":530,"q":"任何单位或个人不得擅自扰动、动用工务设备（轨道、路基、桥涵、隧道、防护设施及各种标志、附属设施等）或在工务设备上加装、拆除设备。","ans":"√"},{"n":531,"q":"自轮运转特种设备除担任本单位车辆调车外，可以担任车站的其他调车任务(救援、抢险等特殊情况除外)。","ans":"×"},{"n":532,"q":"自轮运转特种设备运行进路须在准许施工(维修)前准备好(转线时除外)，除施工(维修)期间必须调整进路外，施工(维修)作业范围内自轮运转特种设备运行经路须固定。","ans":"√"},{"n":533,"q":"自轮运转特种设备进出段管线(岔线、停留线)或站内转线，可不编制调车作业通知单，使用语音记录装置良好的列车无线调度通信设备向司机传达计划。","ans":"√"},{"n":534,"q":"调车人员原则上应与司机同侧作业，因影响调车人员人身安全或瞭望困难等特殊情况，不能在司机一侧作业时，须事先向司机及有关人员传达清楚。","ans":"√"},{"n":535,"q":"进路上有两名及其以上的扳道人员时，由距要道机车方向最近的扳道人员由近而远的要道，由远而近的还道。","ans":"√"},{"n":536,"q":"调车作业时应按调车信号机的显示进行，机车车辆应进入调车信号机内方，出清调车信号机防护区段的轨道电路，不得影响调车信号机的开放。","ans":"√"},{"n":537,"q":"单线自动站间闭塞的车站出站调车时，必须区间空闲，须有停止基本闭塞法的调度命令，与邻站办理闭塞手续，并发给司机出站调车通知书。","ans":"√"},{"n":538,"q":"半自动闭塞区段，遇下列情况按半自动闭塞设备故障处理，停用基本闭塞法，改按路票行车。","ans":"×"},{"n":539,"q":"双线线路所封锁一线时，以开通运行一线的通过信号机划分区间，夜间应在该信号机柱背面距钢轨顶面不低于2m处加挂信号灯，向区间方面显示红色灯光。","ans":"√"},{"n":540,"q":"列车冒进信号机或越过警冲标后，司机可以擅自动车，须立即报告车站值班员(列车调度员)，按车站值班员(列车调度员)指示办理。","ans":"×"},{"n":541,"q":"因施工提前或延迟，对超出运行揭示调度命令规定的施工起止时段的列车，继续执行施工特定行车办法。","ans":"×"},{"n":542,"q":"相邻站向施工站发出列车时，准许车站不向司机递交书面行车凭证和调度命令。","ans":"√"},{"n":543,"q":"显示手信号要做到位置适当、正确及时、横平竖直、灯正圈圆、角度准确、段落清晰。","ans":"√"},{"n":544,"q":"捣固车采用三点法，前司机室操作人员把作业前实测准确线路方向偏差值输入拨道电路，可以完全消除方向偏差。","ans":"×"},{"n":545,"q":"线路大中修验收标准规定清筛洁度应为道碴中粒径小于25mm的颗粒质量不得大于10%。","ans":"×"},{"n":546,"q":"轨道检查车对允许速度大于120km/h的线路每月检查不少于2遍。","ans":"√"},{"n":547,"q":"大型养路机械施工作业应采用静态和动态相结合的验收办法。","ans":"√"},{"n":548,"q":"施工列车在封锁区间内分解后，对停放车辆不必设置停车信号防护。","ans":"×"},{"n":549,"q":"维修作业严禁使用齿条式起道机。","ans":"√"},{"n":550,"q":"封锁线路施工中，可以指派单人到防护区段以外的线路上作业。","ans":"×"},{"n":551,"q":"为了保持电子摆内阻尼油的清洁温度，每两年应更换一次阻尼油。","ans":"√"},{"n":552,"q":"液压系统中的蓄能器是串联接在液压系统的油路中的。","ans":"×"},{"n":553,"q":"轨检车的检查项目不包括车体垂向振动加速度和横向振动加速度。","ans":"×"},{"n":554,"q":"线路大、中修验收标准规定，曲线始、终端不得有反弯或“鹅头”。","ans":"√"},{"n":555,"q":"线路设备状态评定是考核各级线路设备管理工作的基本指标。","ans":"√"},{"n":556,"q":"线路、道岔保养质量评定，是考核线路、道岔养护质量的基本指标。","ans":"√"},{"n":557,"q":"捣固车的电子摆和超平传感器内所用阻尼油，无论牌号还是容量都是相同的。","ans":"×"},{"n":558,"q":"08-32捣固车的故障报警和多路检测系统，有助于判断和处理电气系统故障。","ans":"√"},{"n":559,"q":"参数的变化引起电阻的变化，使流过电阻电流发生变化，使仪表发生偏转，显示参数值。","ans":"√"},{"n":560,"q":"随着参数的增大，电阻减小，显示值减小。","ans":"×"},{"n":561,"q":"08-32捣固车采用单弦检测轨道方向，双弦检测轨道的前、后高低。","ans":"√"},{"n":562,"q":"捣固车上线路方向的检测也是运用绳正法曲线检测的基本原理。","ans":"√"},{"n":563,"q":"捣固车进行拨道作业时，拨道量的大小方向，是由安装在捣固车上的线路方向偏差检测装置（正矢传感器）测出的电压信号。","ans":"√"},{"n":564,"q":"线路方向偏差检测装置是由四台检测小车、一根钢弦、两台矢距传感器及相应的显示仪表组成。","ans":"√"},{"n":565,"q":"人工检测轨道的横向水平通常用道尺，用眼睛观察气泡所在的位置来判断轨道左右水平的偏差。","ans":"√"},{"n":566,"q":"水平检测的基准钢轨，在直线地段任一股轨都可以，在曲线上必须要以有超高的一股钢轨为基准，另一股钢轨就以基准轨为基准提起。","ans":"√"},{"n":567,"q":"线路纵向水平检测原理与线路方向偏差检测的四点法检测原理相同，只是各测点间的距离和传感器的结构不同。","ans":"×"},{"n":568,"q":"能够传递制动机所产生的力，并将该力扩大后推动闸瓦的部分，称为基础制动装置。","ans":"√"},{"n":569,"q":"主动轮对上每个主传动车轴齿轮箱由相应的液压马达驱动，液压马达的动力来自于安装在泵驱动齿轮箱对应输入口的液压泵。","ans":"×"},{"n":570,"q":"手制动机是以手轮的转动来操纵控制并产生制动原力的制动机。","ans":"√"},{"n":571,"q":"大闸制动时，初次减压量不得小于50kPa，追加减压时，每次应达到20kPa，累计减压量不大于140kPa。","ans":"√"},{"n":572,"q":"JZ-7型空气制动机，主要由自动制动阀（大闸）、单独制动阀（小闸）、中继阀、分配阀、作用阀等组成。","ans":"√"},{"n":573,"q":"钩缓装置由车钩、缓冲器及其他附属零部件组成，车钩和钩尾框通过风管连成一体。","ans":"×"},{"n":574,"q":"下作用式车钩是由设在钩头下部推顶机构开启的。上作用式车钩比下作用式车钩开启灵活、轻便。","ans":"√"},{"n":575,"q":"13号上作用式车钩由钩体、钩舌、钩锁、钩舌推铁、钩舌销、上锁销和上锁销杆等零件组成。","ans":"√"},{"n":576,"q":"调整螺母顺时针方向旋转时为缩短活塞行程，逆时针方向旋转时为增大活塞行程，使活塞行程调整到规定的长度，后拧紧锁紧螺母。","ans":"×"},{"n":577,"q":"从动转向架上的车轴齿轮箱在作业走行吋，驱动从动转向架上相应的轮对转动，故称为辅助驱动车轴齿轮箱。","ans":"√"},{"n":578,"q":"根据铁路运输的需要，车辆需要频繁地摘挂。车辆连挂后，车钩应处于完全的开锁状态，以保证车辆运行时不会分离。","ans":"×"},{"n":579,"q":"钩舌销装在钩体的钩耳孔及钩舌的钩舌销孔中，起钩舌的回转轴作用。","ans":"√"},{"n":580,"q":"侧梁上有两个V形的安装橡胶弹簧的导槽，转向架构架通过四对橡胶弹簧支撑在轮对轴箱上。","ans":"√"},{"n":581,"q":"在横梁的中央有安装中心销及关节轴承的轴承箱，车体的全部重量通过前后两个中心销传递给转向架。","ans":"√"},{"n":582,"q":"液压减振器往往与弹簧(橡胶弹簧或金属螺旋圆弹簧)一起串联安装在大型养路机械的走行部，共同组成弾簧减振系统。","ans":"×"},{"n":583,"q":"弹簧的自由高度为263mm，外径145mm，弹簧节距41mm，最小工作载荷9.5kN,最大工作载荷29kN。","ans":"√"},{"n":584,"q":"中心销安装轴承的部位直径较小,故能传递较大的牵引力。","ans":"×"},{"n":585,"q":"橡胶弹簧由三块环型橡胶块组成,能起到减振、缓和冲击的作用。","ans":"√"},{"n":586,"q":"根据在驱动走行时所起的作用不同，轮对分为安装有驱动齿轮的主动轮对和无驱动齿轮的从动轮对。","ans":"√"},{"n":587,"q":"轮心和车轴连接的部分叫轮毂。","ans":"√"},{"n":588,"q":"轮辐一般向外稍偏，使车轮在垂直方向有些弹性，以增大运行时钢轨与车轮的作用力。","ans":"×"},{"n":589,"q":"车在曲线上运行时，外轮沿外轨所走距离小于内轮沿内轨所走距离。","ans":"×"},{"n":590,"q":"车轴采用优质铸铁锻造成型，经热处理和机械加工制成。","ans":"×"},{"n":591,"q":"轮座与轴身部分必须缓和过渡，不允许有任何凸肩存在，以免引起应力集中，轮座是车轴受力最大的部位，所以直径最大。","ans":"√"},{"n":592,"q":"主动轴在安装驱动齿轮和轴承的部分直径较大，驱动齿轮为锥形齿轮，所以主动轴，要传递驱动扭矩和弯矩等，受力较大。","ans":"√"},{"n":593,"q":"轴箱要承受车在运行审的垂直载荷和横向冲击力，因此，要求轴箱体有足够的强度，轴箱体用铸钢制成。","ans":"√"},{"n":594,"q":"圆柱滚动轴承的滚柱与内外圈的滚道成线接触,承载接触面积较小了，因而承受径向载荷能力较大，而且结构简单,工作可靠。","ans":"×"},{"n":595,"q":"捣固臂的作用是安装捣固镐，传递动力和夹持作用力。","ans":"√"},{"n":596,"q":"升降油缸的作用是推拉捣固装置上下运动，使捣固镐插入道床和提起，完成一次捣固作业。","ans":"√"},{"n":597,"q":"XM-1800钢轨铣磨列车在铣磨作业时禁止停车进行铣刀及磨削砂轮的更换。","ans":"×"},{"n":598,"q":"在铣装置作业时，通过铣削装置液压缸将铣装置放置在预定位置，之后铣削单元垂向微进给，直到垂向定位机构显示铣削单元已经贴在钢轨表面。","ans":"√"},{"n":599,"q":"每个打磨装置均有一个独立的液压控制回路，通过计算机控制完成整个道岔区的打磨作业。","ans":"√"},{"n":600,"q":"封锁作业时，龙门吊车由远及近依次将轨枕运输车上的新枕运到新枕输送带上，同时把旧枕从旧枕输送带上运到空的轨枕运输车上。","ans":"√"},{"n":601,"q":"捣固车、稳定车、整形车配合施工可完成线路综合维修的起道、拨道、抄平、拨正曲线、全面捣固以及道床稳定、边坡整形等作业。","ans":"√"},{"n":602,"q":"使用架车机或千斤顶架车时，应有专人指挥，步调一致，同起同落，防止受力不均造成偏斜，支撑物应牢固可靠，支撑物的承载能力必须小于被支撑物的重量，其所在地面应坚硬无下沉。","ans":"×"},{"n":603,"q":"根据铁路运输的需要，车辆需要频繁地摘挂，车辆连挂后，车钩应处于完全的闭锁状态，以保证车辆运行时不会分离。","ans":"√"},{"n":604,"q":"四显示自动闭塞区段两个绿色灯光——准许列车由车站出发，开往次要线路。","ans":"×"},{"n":605,"q":"三显示自动闭塞区段一个黄色灯光——要求列车注意运行，表示运行前方有两个闭塞分区空闲。","ans":"×"},{"n":606,"q":"接近色灯信号机显示两个黄色灯光——表示进站信号机在关闭状态，或表示进站信号机显示两个黄色灯光或一个黄色闪光和一个黄色灯光。","ans":"×"},{"n":607,"q":"色灯复示信号机两个月白色灯光水平位置显示——表示主体信号机显示经道岔侧向位置接车的信号。","ans":"√"},{"n":608,"q":"模拟模块用于有不同的反馈电压模拟输入设备，如发动机传感器，燃油计，位置传感器等.每个模块的接口旁边有个凸起（或标记）可用于连接电缆接头时对准位置。","ans":"√"},{"n":609,"q":"数字模块该模块用于数字输入设备，设备工作将电压发送给模块，诸如限位开关，压力开关等，或用于数字输出设备，有两个位置状态（开/关）使用。","ans":"√"},{"n":610,"q":"高密度数字模块该模块用于与数字输入设备，设备工作将电流发送给模块，如极限开关，压力开关等，或与数字输出设备，有两个位置（开/关）。","ans":"×"},{"n":611,"q":"计算机检测到打磨车上的Jupiter网络故障时，电脑显示屏上的警告面板就会显示警告信息，警告信息的类型将决定大部分实际故障检修步骤。","ans":"√"},{"n":612,"q":"网络模块状态LED在正常的操作状态，红色的错误灯和黄色的下载灯保持关闭状态，绿色的运行灯会每1/2秒闪烁一次。","ans":"√"},{"n":613,"q":"当开启系统后，J42首先开始工作，为主机提供工作电源，主机开始运转，同时J42开始建立菊花链机制，为每个分控模块建立整个网络中的网络地址。","ans":"√"},{"n":614,"q":"分界绝缘节安装在轨道电路分界处，以保证相邻轨道电路间互不影响。","ans":"√"},{"n":615,"q":"两个分界绝缘节之间的钢轨线路（即从送电端到受电端之间），成为轨道电路的控制区段，也就是轨道电路的绝缘。","ans":"×"},{"n":616,"q":"当轨道电路的任一部分发生故障时，均能导致轨道继电器失磁落下，使信号机熄灭红灯，从而保证了行车的安全。","ans":"×"},{"n":617,"q":"在满足列车长度、速度、密度、制动力和信号显示距离等条件下，提高铁路通过能力，将铁路正线分别用车站、线路所等的通过信号机作为分界点，划分站间区间、所间区间，作为列车运行的间隔。","ans":"√"},{"n":618,"q":"轨道车运行控制设备（GYK）是中国列车运行控制系统的组成部分，是防止冒进信号、运行超速并辅助司机提高操纵能力的重要行车设备。","ans":"√"},{"n":619,"q":"GYK采用速度分级控制模式，监控轨道车安全运行。","ans":"√"},{"n":620,"q":"GYK转储设备为专用转储U盘，采用特殊的转储接口以及特殊的加密方式，非法转储U盘无法与DMI进行通信，保证文件的安全可靠。","ans":"√"},{"n":621,"q":"GYK基本数据包括线路固定限速、线路里程断链、长大下坡道、车站信息、进站信号机等资料。","ans":"√"},{"n":622,"q":"大型养路机械运行在正常监控模式或区间作业模式中的区间作业进人、区间作业返回时，当速度大于20km／h时，GYK间隔120s进行报警，要求司机按压手动按钮或脚踩踏板进行应答，否则实施紧急制动，以保障运行安全。","ans":"√"},{"n":623,"q":"机车综合无线通信设备安装在机车驾驶室内，供司机与列车调度员、车站值班员等进行通信，能实现450MHz和GSM-R两种工作模式的转换，具有GPS定位功能。","ans":"√"},{"n":624,"q":"工务和工务机械段是铁路运输业的两大基础部门，具有专业性强，技术复杂的特点。","ans":"×"},{"n":625,"q":"交流连续式轨道电路又分为交直流轨道电路、驼峰轨道电路、阀式轨道电路、25Hz长轨道电路和相敏轨道电路。","ans":"√"},{"n":626,"q":"数字轨道电路的三种制式自然衰耗时序数字化轨道电路、谐振隔离式频率编码轨道电路、谐振隔离式时序编码数字化轨道电路。","ans":"√"},{"n":627,"q":"引接线-连接轨道电路送受端变压器箱或电缆盒与钢轨的导线，一般用涂有防腐油的多股钢丝绳制成。","ans":"√"},{"n":628,"q":"钢轨接续线-用于轨道电路接缝处的连接，以减小接触电压。","ans":"×"},{"n":629,"q":"绝缘接头及其邻近的轨枕要加强捣固，消灭吊板。","ans":"√"},{"n":630,"q":"进行抽换附有引接线、跳线的岔枕，更换尖轨、基本轨、辙叉以及调整轨缝等作业时，必须由供电部门配合方能施工。","ans":"×"},{"n":631,"q":"机动车驾驶员，班前应充分休息，驾驶过程中应严格遵守道路交通安全法规，严禁疲劳驾驶、酒驾、超速驾驶。遇降雪、降雾等恶劣天气出车时，必须经车间主任审批。","ans":"×"},{"n":632,"q":"使用气焊、气割设备时，操作人员必须按规定佩戴安全帽，其他人员应远离喷嘴前方，防止烧伤。","ans":"×"},{"n":633,"q":"大型养路机械运行前，各车作业司机应组织机组人员检查确认行车安全装备，核对运行数据。","ans":"×"},{"n":634,"q":"大型养路机械连挂运行时，本务车运行司机与其他连挂车运行司机应使用无线通信设备保持联系，通报前方信号开放情况以及提出加速、减速或制动的要求，确保操纵同步。","ans":"√"},{"n":635,"q":"连挂后必须先试拉才能连接风管，并打开所有折角塞门，不易重车挂轻车、多车挂少车及向下坡方向挂车，禁止两个车同时挂一个车。","ans":"√"},{"n":636,"q":"进入电气化区段时，严禁机组人员在接触网及其支柱上挂绳索或衣物，不得在支柱上攀登或在支柱旁休息。","ans":"√"},{"n":637,"q":"新造产品竣工后首次挂运至用户所在地须取得监造机构签认的竣工移交记录，大修产品须取得监造机构签认的竣工移交记录或工务机械段验收室签认的检修验收记录，且符合安全运行要求，方可办理挂运。","ans":"√"},{"n":638,"q":"在半自动闭塞区段挂运时，列车尾部须挂列尾装置，其他区段挂运时列车尾部宜挂列尾装置。","ans":"√"},{"n":639,"q":"列尾装置尾部主机安装与摘解、软管连结与摘解，由调车作业人员负责。","ans":"×"},{"n":640,"q":"列车尾部未挂列尾装置时，应吊起尾部车辆制动软管。尾部车辆软管的吊起，有列检作业的由列检人员负责，无列检作业的由司乘人员负责。","ans":"×"},{"n":641,"q":"柴油发动机温度过高或过低，都将影响正常工作，因而这也是柴油发动机长期可靠工作的必要条件之一。","ans":"√"},{"n":642,"q":"编组连挂后，不应对提钩装置、折角塞门进行捆绑加固。","ans":"×"},{"n":643,"q":"具有弹簧驻车制动功能的工务机械车挂运前，弹簧驻车制动电磁阀应置于无火回送位。","ans":"√"},{"n":644,"q":"首位带式物料运输车前应编挂设有支架的过渡平车或其他带有支架的大型养路机械，用于支撑带式物料运输车的旋转抛带。","ans":"√"},{"n":645,"q":"驾驶室内有可能因误碰、误操作而影响行车安全的开关、按钮、手柄等，如紧急制动按钮、旁路制动按钮、主辅机转换阀，须加装防误碰保护装置，但不影响正常使用。","ans":"√"},{"n":646,"q":"长轨列车重车运行时，随时注意观察运行状况，夜间或隧道内运行时应打开安全车、作业首车及锁定车上的照明灯，发现异常及故障时及时排除。","ans":"√"},{"n":647,"q":"列车临时停靠车站时，押车人员未经押车负责人同意且设置专人防护前，可以下车、穿越线路、撤设防溜。","ans":"×"},{"n":648,"q":"遇火灾、脱轨、部件脱落等直接危及人身安全和行车安全的紧急情况时，押车人员应立即报告押车站值班员。","ans":"×"},{"n":649,"q":"遇最外方车轮因工作装置、制动拉杆等设备影响不能支设铁鞋时，可依次向内顺延选择第二、三、四车轮下支设。","ans":"√"},{"n":650,"q":"正驾驶在左侧车窗探头并剑指第一架调车信号机，副驾驶位于正驾驶右后侧剑指第一架调车信号机，二人共同确认并呼唤应答。","ans":"√"},{"n":651,"q":"连挂或接近停留车辆时，按十、五、三车距离和信号要求控制速度，执行呼唤应答，按照十车距离（110m）限速17km/h，五车距离（55m）限速12km/h，三车距离（33m）限速7km/h控制车速。","ans":"√"},{"n":652,"q":"进入限速施工地点后，副驾驶应立岗瞭望，提示正驾驶严守限制速度并鸣笛（限鸣区除外）。","ans":"×"},{"n":653,"q":"区间封锁司乘人员接到车站递交的调度命令后，执行二人确认核对制度，明确封锁区间、防护点停车位置等重点，多机连挂运行时，应将调度命令内容传达至补机司乘人员，确保预输参数里程与调度命令里程一致，修改进入区间车次，与车站核对调度命令并进行车机联控后方可动车。","ans":"√"},{"n":654,"q":"进入换轨地段时严格按照车站要求的速度控速通过，紧盯前方线路状态，遇线路异常时必须立即采取停车措施，停车后及时向施工负责人反馈信息，严禁擅自操作自轮运转车辆后退。","ans":"×"},{"n":655,"q":"区间封锁返回时，进站前须机外停车，确认行车凭证、道岔进路、信号显示正确后方可进站。","ans":"√"},{"n":656,"q":"每日作业完毕收车后，使用运行记录数据专用存储器，对所产生的GYK运行记录数据进行转储，交由专人于18时前回传到指定数据服务器。遇特殊原因影响无法于18时前回传数据的，应于次日8时前回传。","ans":"×"},{"n":657,"q":"信号显示要求正向径路准备停车（显示黄灯）时，右手拢拳伸拇指和小指，拳心向左。","ans":"×"},{"n":658,"q":"信号显示要求停车（显示红灯，包括固定和临时）时，右臂拢拳，举拳与眉齐，拳心向左，小臂上下摇动3次。","ans":"√"},{"n":659,"q":"注意警惕运行时，右臂拢拳，大小臂成90度，举拳与眉齐，拳心向左。","ans":"√"},{"n":660,"q":"调度命令下达前，做好开车准备工作，司乘人员认真学习《施工及车辆运行计划表》、《施工车辆作业安全控制表》，明确封锁方式、施工项目、摘解地点、连挂地点、限速地点。","ans":"√"},{"n":661,"q":"自动闭塞区段最后一架通过信号机显示黄色灯光，机车信号显示一个黄色灯光，表示进站信号机处于关闭状态，司乘人员必须严格控制速度，在机外停车后可以解锁。","ans":"×"},{"n":662,"q":"站内停车时接收到运行前方临时限速的调度命令时。司乘人员应人工输入运行揭示信息实现GYK机控，司乘人员输入时须一人输入、一人核对，并在运行日志上记录，自轮运转车辆越过调度命令载明的慢行地段后，司乘人员可自行解除运行揭示控制。","ans":"√"},{"n":663,"q":"摘解作业时，应先设好防护并确认车辆处于制动状态，做到“一关前、二关后、三摘风管、四提钩、五解体、六试风、七运行”。","ans":"√"},{"n":664,"q":"自轮运转车辆应配备双面警示牌，正面为“铁鞋已支”、反面为“铁鞋已取”，自轮运转车辆在静止状态下采取铁鞋防溜后，司乘人员须在油门控制手柄处揭示“铁鞋已支”，撤除铁鞋后，揭示“铁鞋已取”。","ans":"√"},{"n":665,"q":"铁路行车组织工作，必须贯彻安全生产的方针，坚持高度集中、分数领导的原则。","ans":"×"},{"n":666,"q":"捣固车传动轴有三种结构，定长万向传动轴，过桥传动轴和长度可伸缩万向传动轴。","ans":"√"},{"n":667,"q":"调车指挥人应按规定不间断显示调车手信号，没有司机鸣笛回示时，应立即显示停车信号。","ans":"√"},{"n":668,"q":"出站调车作业完毕，车站无须将出站调车通知书收回后，才能向邻站发出电话记录号码，办理区间开通手续。","ans":"×"},{"n":669,"q":"变量马达改变斜盘倾角，不仅影响马达的转矩，而且影响它的转速和转向，斜盘倾角越大，产生的转矩越大，转速越低。","ans":"√"},{"n":670,"q":"单作用缸与双作用缸的区别，单作用缸两腔为压力油腔，如起道油缸，双作用缸仅一腔均可作为压力油腔。","ans":"×"},{"n":671,"q":"单作用液压缸一个方向的运动依靠液压作用力实现，另一个方向依靠弹簧力、重力等实现。","ans":"√"},{"n":672,"q":"管道应尽量短，最好横平竖直，拐弯少。","ans":"√"},{"n":673,"q":"配砟整形车工作装置由侧犁、中犁和后犁组成。","ans":"×"},{"n":674,"q":"DWL-48每次作业都要对卫星小车三、四轴进行挂挡动作，冲击载荷较为频繁，随着设备的长期使用，这个频繁冲击载荷F是造成大齿轮齿端掉块损伤的一个重要原因。","ans":"√"},{"n":675,"q":"十字轴是中空的，内腔储存润滑油并有油路通向轴颈以润滑轴承，润滑油从注油嘴注人十字轴内腔。在十字轴的轴颈上套装着毛毡油封。","ans":"√"},{"n":676,"q":"进行大角度打磨作业时，遇有不能拆除的应答器等障碍物应提前调整打磨电机大小。","ans":"×"},{"n":677,"q":"作业时应加强防护，走行及作业中警示灯应保持关闭状态。","ans":"×"},{"n":678,"q":"打磨电机运转时可以提升或下降打磨小车。","ans":"×"},{"n":679,"q":"大超高曲线上不得提升打磨小车。","ans":"√"},{"n":680,"q":"配砟整形车配砟可以超出轨面，不得妨碍捣固车作业。","ans":"×"},{"n":681,"q":"需要登踏车体上部时，电气化区段应申请办理接触网停电手续，手要紧握扶手，挂好安全带，可以穿带钉鞋或塑料底鞋登高。","ans":"×"},{"n":682,"q":"在复曲线的大小半径连接处，正矢与计算正矢的容许差，按大半径曲线的缓和曲线规定办理，缓和曲线与直线连接处不得有反弯或“鹅头”。","ans":"√"},{"n":683,"q":"日常检查保养、定期检查保养、年修、状态监测由运用单位组织实施。全面检修（总成大修）由运用单位或送取得认证资质的单位实施。","ans":"√"},{"n":684,"q":"年修、全面检修（总成大修）竣工后，由兼职验收员按本规则验收，并在检修记录上签章。","ans":"√"},{"n":685,"q":"检查液压油箱油位，油液不足时，应用滤芯精度不低于10μm的滤油机给油箱补充不同厂家相同牌号的液压油。","ans":"×"},{"n":686,"q":"集中润滑系统储油罐内的润滑脂高度不足时，添加润滑脂至刻线下部位置，作业前给捣固装置脂润滑系统注润滑脂，同时检查集中润滑系统工作情况。","ans":"×"},{"n":687,"q":"柴油机、液力机械变速箱、发电机组的定期检查保养，在按制造商维修保养手册规定进行检查保养的基础上，还应对零配件进行采样分析。","ans":"×"},{"n":688,"q":"用40路检测F00,在前司机室转动拨道正矢给定数字电位器4fl,F00应从0～+10V或0V~-10V连续变化。","ans":"√"},{"n":689,"q":"用40路检测F01,拨动拨道正矢传感器的拨叉从-200～+200mm,F01应从-4.62～+4.62V连续变化。","ans":"√"},{"n":690,"q":"用40路检测F02,拨动测量正矢传感器的拨叉从-200～+200mm,F02应从-4.62～+4.62V连续变化。","ans":"√"},{"n":691,"q":"用40路检测F06,在前司机室转动前端偏移给定电位器4f4,F06应从-10~+10V连续变化。","ans":"√"},{"n":692,"q":"当深度给定值确定后，发出下插指令，捣固头应有下插动作，到达给定深度后应立即停止，下插指令取消后，捣固头应立即上升到作业下位。","ans":"×"},{"n":693,"q":"检查数字地(OD)和保险， 身造成一定的损害的燃烧现象。","ans":"√"},{"n":722,"q":"没有看到调车指挥人的起动信号，不准动车。","ans":"√"}]};

  /* ===== 工具函数 ===== */
  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function $(id) { return document.getElementById(id); }

  /* ===== 组装题库 ===== */
  var ALL = [];
  RAW.choice.forEach(function (q) {
    ALL.push({ type: "choice", num: q.n, q: q.q, opts: q.opts, ans: q.ans });
  });
  RAW.judge.forEach(function (q) {
    ALL.push({ type: "judge", num: q.n, q: q.q, ans: q.ans });
  });

  var nChoice = RAW.choice.length, nJudge = RAW.judge.length;
  $("st-total").textContent = ALL.length;
  $("st-choice").textContent = nChoice;
  $("st-judge").textContent = nJudge;
  $("st-real").textContent = ALL.length;

  /* ===== 状态 ===== */
  var typeFilter = "all";     // all | choice | judge
  var doShuffle = false;
  var autoNext = true;
  var list = [];              // 当前作答列表
  var idx = 0;
  var stats = { ok: 0, bad: 0 };
  var answeredCount = 0;
  var currentAnswered = false;
  var wrongItems = [];        // {q, type, ans, opts, num}

  /* ===== 设置交互 ===== */
  var segType = $("seg-type");
  segType.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    typeFilter = b.dataset.v;
    segType.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
  });
  $("sw-shuffle").addEventListener("click", function () {
    doShuffle = !doShuffle;
    $("sw-shuffle").classList.toggle("on", doShuffle);
  });
  $("sw-auto").addEventListener("click", function () {
    autoNext = !autoNext;
    $("sw-auto").classList.toggle("on", autoNext);
  });

  /* ===== 建立作答列表 ===== */
  function buildList() {
    var src = ALL;
    if (typeFilter === "choice") src = ALL.filter(function (q) { return q.type === "choice"; });
    else if (typeFilter === "judge") src = ALL.filter(function (q) { return q.type === "judge"; });
    list = doShuffle ? shuffle(src) : src;
  }

  /* ===== 页面切换 ===== */
  function showPage(id) {
    ["page-start", "page-quiz", "page-result"].forEach(function (p) {
      $(p).classList.toggle("hidden", p !== id);
    });
    var inQuiz = (id === "page-quiz");
    $("topbar").style.display = inQuiz ? "" : "none";
    $("progTrack").style.display = inQuiz ? "" : "none";
  }

  /* ===== 渲染当前题 ===== */
  function render() {
    var q = list[idx];
    currentAnswered = false;
    $("q-feedback").className = "feedback";
    $("btn-next").style.display = "none";
    $("btn-prev").disabled = (idx === 0);

    if (q.type === "choice") {
      $("q-tag").textContent = "选择题";
      $("q-tag").className = "tag tag-choice";
    } else {
      $("q-tag").textContent = "判断题";
      $("q-tag").className = "tag tag-judge";
    }
    $("q-count").textContent = "第 " + (idx + 1) + " / " + list.length + " 题";
    $("q-text").textContent = q.q;

    // 选项
    var box = $("q-options");
    box.innerHTML = "";
    var keys;
    if (q.type === "choice") keys = ["A", "B", "C", "D"];
    else keys = ["√", "×"];

    var labels = q.type === "choice" ? q.opts : ["正确", "错误"];

    keys.forEach(function (k, i) {
      var div = document.createElement("div");
      div.className = "opt";
      div.dataset.key = k;
      var keyEl = document.createElement("span");
      keyEl.className = "key";
      keyEl.textContent = q.type === "choice" ? k : (k === "√" ? "√" : "×");
      var txtEl = document.createElement("span");
      txtEl.className = "txt";
      txtEl.textContent = (q.type === "choice" ? (k + "、") : "") + labels[i];
      var mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = "";
      div.appendChild(keyEl); div.appendChild(txtEl); div.appendChild(mark);
      div.addEventListener("click", function () { onPick(div, k); });
      box.appendChild(div);
    });

    updateProgress();
  }

  function updateProgress() {
    var pct = list.length ? ((idx) / list.length) * 100 : 0;
    $("progFill").style.width = pct + "%";
    updateScore();
  }
  function updateScore() {
    $("s-ok").textContent = stats.ok;
    $("s-bad").textContent = stats.bad;
    var total = stats.ok + stats.bad;
    $("s-rate").textContent = total ? Math.round(stats.ok / total * 100) + "%" : "0%";
  }

  /* ===== 作答 ===== */
  function onPick(el, key) {
    if (currentAnswered) return;
    var q = list[idx];
    var isCorrect = (key === q.ans);

    // 锁定所有选项并高亮
    var opts = $("q-options").querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.classList.add("locked");
      if (o.dataset.key === q.ans) {
        o.classList.add("correct");
        o.querySelector(".mark").textContent = "✓";
      }
      if (o === el && !isCorrect) {
        o.classList.add("wrong");
        o.querySelector(".mark").textContent = "✗";
      }
    });

    currentAnswered = true;
    answeredCount++;

    var fb = $("q-feedback");
    if (isCorrect) {
      stats.ok++;
      fb.className = "feedback show ok";
      fb.innerHTML = '<span class="fb-title">✓ 回答正确！</span>';
      if (autoNext) {
        setTimeout(function () {
          if (idx + 1 < list.length) { idx++; render(); }
          else finish();
        }, 900);
      } else {
        $("btn-next").style.display = "";
      }
    } else {
      stats.bad++;
      var wrongRec = {
        type: q.type, num: q.num, q: q.q, ans: q.ans,
        opts: q.type === "choice" ? q.opts : null
      };
      wrongItems.push(wrongRec);
      fb.className = "feedback show bad";
      fb.innerHTML = '<span class="fb-title">✗ 回答错误，正确答案是：' +
        escapeHtml(formatAnswer(q)) + '</span>';
      showModal(q);
    }
    updateScore();
  }

  function formatAnswer(q) {
    if (q.type === "choice") {
      return q.ans + "、" + q.opts["ABCD".indexOf(q.ans)];
    }
    return q.ans === "√" ? "正确（√）" : "错误（×）";
  }

  function showModal(q) {
    $("m-icon").textContent = "❌";
    $("m-title").textContent = "回答错误";
    $("m-ans").textContent = formatAnswer(q);
    $("m-note").textContent = q.type === "choice"
      ? "已为你标出正确选项，记住这个知识点哦～"
      : "判断题为“对”还是“错”，注意记忆易混点～";
    $("overlay").classList.add("show");
  }

  $("btn-modal-close").addEventListener("click", function () {
    $("overlay").classList.remove("show");
    if (idx + 1 < list.length) { idx++; render(); }
    else finish();
  });

  /* ===== 导航 ===== */
  $("btn-next").addEventListener("click", function () {
    if (idx + 1 < list.length) { idx++; render(); }
    else finish();
  });
  $("btn-prev").addEventListener("click", function () {
    if (idx > 0) { idx--; render(); }
  });
  $("btn-end").addEventListener("click", finish);

  /* ===== 开始 & 结束 ===== */
  $("btn-start").addEventListener("click", function () {
    buildList();
    if (!list.length) { alert("当前筛选下没有题目"); return; }
    idx = 0; stats = { ok: 0, bad: 0 }; answeredCount = 0; wrongItems = [];
    showPage("page-quiz");
    render();
  });

  function finish() {
    showPage("page-result");
    var total = stats.ok + stats.bad;
    var rate = total ? Math.round(stats.ok / total * 100) : 0;
    $("r-ok").textContent = stats.ok;
    $("r-bad").textContent = stats.bad;
    $("r-rate").textContent = rate + "%";
    $("r-sub").textContent = "共作答 " + total + " 题（题库范围 " + list.length + " 题）";
    $("r-icon").textContent = rate >= 90 ? "🏆" : rate >= 60 ? "💪" : "📚";
    $("r-title").textContent = rate >= 90 ? "太棒了！" : rate >= 60 ? "继续加油！" : "多练几遍吧！";

    // 错题列表
    var ww = $("r-wrong-wrap");
    if (wrongItems.length) {
      ww.classList.remove("hidden");
      var box = $("r-wrong");
      box.innerHTML = "";
      wrongItems.forEach(function (w) {
        var div = document.createElement("div");
        div.className = "wl-item";
        var t = w.type === "choice" ? "选择题" : "判断题";
        div.innerHTML = '<div class="wl-q">[' + t + '·' + w.num + '] ' +
          escapeHtml(w.q) + '</div>' +
          '<div class="wl-a">你的答案错误 · 正确：<span class="c">' +
          escapeHtml(formatAnswer(w)) + '</span></div>';
        box.appendChild(div);
      });
    } else {
      ww.classList.add("hidden");
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  $("btn-restart").addEventListener("click", function () { showPage("page-start"); });
  $("btn-redo").addEventListener("click", function () {
    if (!wrongItems.length) { alert("没有错题，不需要重做"); return; }
    // 用错题重建列表
    list = wrongItems.map(function (w, i) {
      return { type: w.type, num: w.num, q: w.q, opts: w.opts, ans: w.ans, __redo: true };
    });
    // 保留来源序号显示
    idx = 0; stats = { ok: 0, bad: 0 }; answeredCount = 0; wrongItems = [];
    showPage("page-quiz");
    render();
  });

  /* ===== 键盘快捷键 ===== */
  document.addEventListener("keydown", function (e) {
    if ($("page-quiz").classList.contains("hidden")) return;
    if ($("overlay").classList.contains("show")) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("btn-modal-close").click(); }
      return;
    }
    var k = e.key.toUpperCase();
    if (["A", "B", "C", "D", "√", "×", "1", "2", "3", "4"].indexOf(k) >= 0) {
      var map = { "1": "A", "2": "B", "3": "C", "4": "D" };
      var key = map[k] || k;
      if (list[idx].type === "judge") {
        if (k === "1") key = "√";
        else if (k === "2") key = "×";
      }
      var el = $("q-options").querySelector('.opt[data-key="' + key + '"]');
      if (el && !currentAnswered) onPick(el, key);
    } else if (e.key === "ArrowRight" || e.key === "Enter") {
      if (!currentAnswered) return;
      if ($("btn-next").style.display !== "none") $("btn-next").click();
    } else if (e.key === "ArrowLeft") {
      $("btn-prev").click();
    }
  });

  /* 初始化显示开始页 */
  showPage("page-start");
})();
</script>
</body>
</html>
